name: Register an outside trial
description: Provide consented evidence from a repository you own or maintain. Opening this form does not count as an installation.
title: "[adoption] "
labels: ["adoption"]
body:
  - type: dropdown
    id: state
    attributes:
      label: Installation state
      options:
        - Public PR receipt created
        - Public PR receipt verified offline
        - Evaluating
        - Installed locally
        - Running in CI
        - Receipt artifact retained
        - Required merge check
        - Maintainer accepted contradiction
        - Removed after trial
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Evidence mode
      options:
        - Public PR receipt
        - Full transcript or summary
        - Portable receipt
        - Not installed
    validations:
      required: true
  - type: textarea
    id: job
    attributes:
      label: What job did you need Agent Vigil to do?
    validations:
      required: true
  - type: textarea
    id: friction
    attributes:
      label: Biggest setup or trust problem
      description: Include the exact command or error when safe.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Public evidence links
      description: Link the repository, exact workflow, run, receipt artifact, and maintainer disposition when public. Private reports are welcome but are not added to public milestone counts.
      placeholder: "Repository: ...\nWorkflow: ...\nRun or receipt: ...\nMaintainer disposition: ..."
    validations:
      required: false
  - type: checkboxes
    id: listing_consent
    attributes:
      label: Public adopter listing
      options:
        - label: I own or maintain the repository and consent to Agent Vigil listing the linked public evidence in ADOPTERS.md.
          required: false
  - type: markdown
    attributes:
      value: A public mention, browser receipt, or submitted form is not counted as a configured repository. Public adoption counts require a workflow that actually uses Agent Vigil. A required job name by itself does not count; required-check evidence needs an external required workflow or App-owned exact-head check.
  - type: textarea
    id: retain
    attributes:
      label: What would make you keep or remove the check?
    validations:
      required: true
