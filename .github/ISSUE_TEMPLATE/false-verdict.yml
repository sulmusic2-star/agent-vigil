name: False or unclear verdict
description: Report a false PASS, false FAIL, or unexplained INCONCLUSIVE without publishing private transcripts.
title: "[verdict] "
labels: ["verdict-review"]
body:
  - type: markdown
    attributes:
      value: |
        Do not attach secrets or a private transcript. A minimal synthetic fixture is best. If the evidence cannot be shared safely, describe only the adapter, rule ID, expected verdict, and observed verdict.
  - type: dropdown
    id: kind
    attributes:
      label: Verdict problem
      options:
        - False PASS
        - False FAIL
        - Unexplained INCONCLUSIVE
        - Adapter or setup failure
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Agent Vigil version
      placeholder: "0.8.0"
    validations:
      required: true
  - type: input
    id: adapter
    attributes:
      label: Agent and transcript adapter
      placeholder: "Codex / codex"
    validations:
      required: true
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: "test-count"
  - type: textarea
    id: expected
    attributes:
      label: Expected and observed behavior
      description: Explain the expected verdict, observed verdict, and why they differ.
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Minimal sanitized fixture or reproduction
      description: Paste a synthetic fixture or link to a public reproduction. Remove private source, prompts, paths, and credentials.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed secrets and private transcript content.
          required: true
