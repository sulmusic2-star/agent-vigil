name: Frozen cross-corpus benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch frozen Swarm corpus
        run: |
          git clone --filter=blob:none https://github.com/moonrunnerkc/swarm-orchestrator.git "$RUNNER_TEMP/swarm"
          git -C "$RUNNER_TEMP/swarm" checkout b2b681ff529929d39a14c0541d0e2b71b642b5da
      - name: Reproduce oracle training-corpus result
        run: |
          npm run benchmark:swarm -- \
            --corpus "$RUNNER_TEMP/swarm/benchmarks/oracle-corpus" \
            --source-sha b2b681ff529929d39a14c0541d0e2b71b642b5da \
            --output "$RUNNER_TEMP/results/swarm-oracle-results.json"
      - name: Reproduce real-PR advisory calibration
        run: |
          npm run benchmark:swarm-real -- \
            --root "$RUNNER_TEMP/swarm/benchmarks/real-prs" \
            --source-sha b2b681ff529929d39a14c0541d0e2b71b642b5da \
            --output "$RUNNER_TEMP/results/swarm-real-results.json"
      - name: Verify results match the committed ledger
        run: |
          diff -u benchmarks/swarm-oracle-results.json "$RUNNER_TEMP/results/swarm-oracle-results.json"
          diff -u benchmarks/swarm-oracle-results.md "$RUNNER_TEMP/results/swarm-oracle-results.md"
          diff -u benchmarks/swarm-real-results.json "$RUNNER_TEMP/results/swarm-real-results.json"
          diff -u benchmarks/swarm-real-results.md "$RUNNER_TEMP/results/swarm-real-results.md"
      - uses: actions/upload-artifact@v7
        with:
          name: frozen-cross-corpus-results
          path: ${{ runner.temp }}/results
          retention-days: 30
