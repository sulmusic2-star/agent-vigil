name: Agent Vigil public App gate

on:
  # The centrally operated App signs every input. This workflow is selected
  # from Agent Vigil's default branch, never from the customer repository.
  workflow_dispatch:
    inputs:
      envelope: { required: true, type: string }
      dispatchSignature: { required: true, type: string }

permissions:
  contents: read

jobs:
  authenticate:
    name: Authenticate App dispatch
    runs-on: ubuntu-24.04
    environment: agent-vigil-public-app
    outputs:
      repository: ${{ steps.bind.outputs.repository }}
      owner: ${{ steps.bind.outputs.owner }}
      name: ${{ steps.bind.outputs.name }}
      installation-id: ${{ steps.bind.outputs.installation_id }}
      event: ${{ steps.bind.outputs.event }}
      number: ${{ steps.bind.outputs.number }}
      base-sha: ${{ steps.bind.outputs.base_sha }}
      head-sha: ${{ steps.bind.outputs.head_sha }}
      base-ref: ${{ steps.bind.outputs.base_ref }}
      head-ref: ${{ steps.bind.outputs.head_ref }}
      check-run-id: ${{ steps.bind.outputs.check_run_id }}
      delivery-id: ${{ steps.bind.outputs.delivery_id }}
    steps:
      - id: bind
        name: Verify App actor, HMAC, repository, commits, and check
        env:
          DISPATCH_SECRET: ${{ secrets.AGENT_VIGIL_PUBLIC_APP_DISPATCH_SECRET }}
          ACTOR: ${{ github.actor }}
          EXPECTED_ACTOR: ${{ vars.AGENT_VIGIL_CONTROL_APP_ACTOR || vars.AGENT_VIGIL_PUBLIC_APP_ACTOR }}
          DISPATCH_ENVELOPE: ${{ inputs.envelope }}
          DISPATCH_SIGNATURE: ${{ inputs.dispatchSignature }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHmac, timingSafeEqual } from "node:crypto";
          import { appendFileSync } from "node:fs";

          const e = process.env;
          const envelope = e.DISPATCH_ENVELOPE ?? "";
          const sha = /^[0-9a-f]{40}$/;
          const repository = /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/;
          const positive = /^[1-9][0-9]*$/;
          const delivery = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-8][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i;
          const signature = /^sha256=[0-9a-f]{64}$/;
          function validBranchName(input, maxLength = 255) {
            if (!input || input.length > maxLength || input === "@" || input.startsWith("/") || input.endsWith("/") || input.endsWith(".")) return false;
            if (/[\u0000-\u0020\u007f~^:?*\[\\]/.test(input) || input.includes("..") || input.includes("@{") || input.includes("//")) return false;
            return input.split("/").every((part) => part && !part.startsWith(".") && !part.endsWith(".lock"));
          }
          if (!e.DISPATCH_SECRET || e.DISPATCH_SECRET.length < 32) throw new Error("dispatch secret is missing or too short");
          if (!e.EXPECTED_ACTOR || e.ACTOR !== e.EXPECTED_ACTOR) throw new Error("dispatch actor is not the Agent Vigil control App");
          if (!/^[A-Za-z0-9_-]+$/.test(envelope) || envelope.length > 8192) throw new Error("dispatch envelope is invalid");
          if (!signature.test(e.DISPATCH_SIGNATURE ?? "")) throw new Error("dispatch signature is invalid");
          const expected = `sha256=${createHmac("sha256", e.DISPATCH_SECRET).update(envelope).digest("hex")}`;
          const left = Buffer.from(expected);
          const right = Buffer.from(e.DISPATCH_SIGNATURE);
          if (left.length !== right.length || !timingSafeEqual(left, right)) throw new Error("dispatch signature does not match the exact change identity");
          let value;
          try { value = JSON.parse(Buffer.from(envelope, "base64url").toString("utf8")); }
          catch { throw new Error("dispatch envelope is not valid JSON"); }
          const keys = ["schema", "deliveryId", "event", "repository", "installationId", "number", "baseSha", "headSha", "baseRef", "headRef", "checkRunId"];
          if (!value || typeof value !== "object" || Array.isArray(value) || Object.keys(value).sort().join("\n") !== [...keys].sort().join("\n")) throw new Error("dispatch envelope fields are invalid");
          if (!keys.every((key) => typeof value[key] === "string")) throw new Error("dispatch envelope values must be strings");
          if (value.schema !== "agent-vigil-public-app-v1") throw new Error("dispatch schema is unsupported");
          if (!delivery.test(value.deliveryId) || !repository.test(value.repository)) throw new Error("delivery or repository identity is invalid");
          if (!positive.test(value.installationId) || !positive.test(value.checkRunId)) throw new Error("installation or check identity is invalid");
          if (!sha.test(value.baseSha) || !sha.test(value.headSha) || value.baseSha === value.headSha) throw new Error("commit identity is invalid");
          if (value.event !== "pull_request" && value.event !== "merge_group") throw new Error("event kind is invalid");
          if (value.event === "pull_request" && (!positive.test(value.number) || value.headRef !== "" || !validBranchName(value.baseRef))) throw new Error("pull request identity is invalid");
          if (value.event === "merge_group") {
            const baseBranch = value.baseRef.startsWith("refs/heads/") ? value.baseRef.slice("refs/heads/".length) : "";
            const headBranch = value.headRef.startsWith("refs/heads/") ? value.headRef.slice("refs/heads/".length) : "";
            if (value.number !== "" || !validBranchName(baseBranch) || !headBranch.startsWith(`gh-readonly-queue/${baseBranch}/`) || !validBranchName(headBranch, 1024)) throw new Error("merge-group identity is invalid");
          }
          const [owner, name] = value.repository.split("/");
          appendFileSync(e.GITHUB_OUTPUT, [
            `delivery_id=${value.deliveryId}`, `repository=${value.repository}`, `owner=${owner}`, `name=${name}`,
            `installation_id=${value.installationId}`, `event=${value.event}`,
            `number=${value.number}`, `base_sha=${value.baseSha}`, `head_sha=${value.headSha}`,
            `base_ref=${value.baseRef}`, `head_ref=${value.headRef}`, `check_run_id=${value.checkRunId}`, "",
          ].join("\n"));
          NODE

  evidence:
    name: Verify exact customer commit without App credentials
    needs: authenticate
    runs-on: ubuntu-24.04
    environment: agent-vigil-public-app
    outputs:
      vigil-status: ${{ steps.vigil.outputs.status }}
      receipt-hash: ${{ steps.vigil.outputs['receipt-hash'] }}
      pr-body-sha256: ${{ steps.change-event.outputs.pr_body_sha256 }}
    steps:
      - id: checkout-token
        name: Mint a short-lived checkout token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AGENT_VIGIL_PUBLIC_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_VIGIL_PUBLIC_APP_PRIVATE_KEY }}
          owner: ${{ needs.authenticate.outputs.owner }}
          repositories: ${{ needs.authenticate.outputs.name }}
          permission-contents: read
          permission-pull-requests: read
      - id: change-event
        name: Materialize trusted pull-request or merge-group evidence outside the checkout
        env:
          APP_TOKEN: ${{ steps.checkout-token.outputs.token }}
          EVENT_KIND: ${{ needs.authenticate.outputs.event }}
          TARGET_REPOSITORY: ${{ needs.authenticate.outputs.repository }}
          DELIVERY_ID: ${{ needs.authenticate.outputs.delivery-id }}
          BASE_SHA: ${{ needs.authenticate.outputs.base-sha }}
          HEAD_SHA: ${{ needs.authenticate.outputs.head-sha }}
          BASE_REF: ${{ needs.authenticate.outputs.base-ref }}
          HEAD_REF: ${{ needs.authenticate.outputs.head-ref }}
          PR_NUMBER: ${{ needs.authenticate.outputs.number }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { appendFileSync, lstatSync, realpathSync, writeFileSync } from "node:fs";
          import { join } from "node:path";
          const e = process.env;
          async function request(path) {
            const response = await fetch(`${e.GITHUB_API_URL}${path}`, {
              headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${e.APP_TOKEN}`, "X-GitHub-Api-Version": "2026-03-10" },
            });
            const declared = Number(response.headers.get("content-length") ?? "0");
            if (Number.isFinite(declared) && declared > 1048576) throw new Error("GitHub pull-request response is too large");
            const body = await response.text();
            if (Buffer.byteLength(body) > 1048576) throw new Error("GitHub pull-request response is too large");
            if (!response.ok) throw new Error(`GitHub API ${response.status}: ${body.slice(0, 256)}`);
            return JSON.parse(body);
          }
          const root = realpathSync(e.RUNNER_TEMP);
          const stat = lstatSync(root);
          if (!stat.isDirectory() || stat.isSymbolicLink()) throw new Error("runner temporary directory is not a real directory");
          const path = join(root, `agent-vigil-public-app-${e.DELIVERY_ID}.json`);
          let prBodySha256 = "";
          let event;
          if (e.EVENT_KIND === "pull_request") {
            const pull = await request(`/repos/${e.TARGET_REPOSITORY}/pulls/${e.PR_NUMBER}`);
            if (pull?.state !== "open" || String(pull?.number) !== e.PR_NUMBER
              || pull?.base?.repo?.full_name !== e.TARGET_REPOSITORY
              || pull?.base?.sha !== e.BASE_SHA || pull?.head?.sha !== e.HEAD_SHA || pull?.base?.ref !== e.BASE_REF
              || typeof pull?.user?.login !== "string" || !pull.user.login
              || (pull?.body !== null && pull?.body !== undefined && typeof pull.body !== "string")) {
              throw new Error("live pull-request evidence does not match the signed exact-change envelope");
            }
            event = {
              action: "synchronize",
              source_event: "pull_request",
              repository: { full_name: e.TARGET_REPOSITORY },
              pull_request: {
                number: pull.number,
                user: { login: pull.user.login },
                body: pull.body ?? "",
                base: { sha: pull.base.sha, ref: pull.base.ref },
                head: { sha: pull.head.sha, ref: pull.head.ref },
              },
            };
            prBodySha256 = createHash("sha256").update(pull.body ?? "", "utf8").digest("hex");
          } else {
            const baseRef = e.BASE_REF.startsWith("refs/") ? e.BASE_REF : `refs/heads/${e.BASE_REF}`;
            event = {
              action: "checks_requested",
              source_event: "merge_group",
              repository: { full_name: e.TARGET_REPOSITORY },
              merge_group: { base_sha: e.BASE_SHA, head_sha: e.HEAD_SHA, base_ref: baseRef, head_ref: e.HEAD_REF },
            };
          }
          writeFileSync(path, `${JSON.stringify(event)}\n`, { encoding: "utf8", flag: "wx", mode: 0o600 });
          appendFileSync(e.GITHUB_OUTPUT, `path=${path}\npr_body_sha256=${prBodySha256}\n`);
          NODE
      - name: Select the exact trusted host Node.js runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.23.2
          package-manager-cache: false
      - name: Check out exact customer head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.authenticate.outputs.repository }}
          token: ${{ steps.checkout-token.outputs.token }}
          ref: ${{ needs.authenticate.outputs.head-sha }}
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: true
      - name: Remove checkout authentication material before candidate execution
        run: |
          set -euo pipefail
          if git config --local --get-all http.https://github.com/.extraheader >/dev/null 2>&1; then
            git config --local --unset-all http.https://github.com/.extraheader
          fi
          if git config --local --get-all credential.helper >/dev/null 2>&1; then
            git config --local --unset-all credential.helper
          fi
          if git config --local --get-regexp 'extraheader|credential' >/dev/null 2>&1; then
            echo "checkout credentials remain after cleanup" >&2
            exit 1
          fi
      - id: vigil
        name: Run the independent exact-commit gate
        uses: sulmusic2-star/agent-vigil@b0bbbe31935f53ae2635ea8434eb728440b43e05 # reviewed workflow-dispatch runtime bytes
        with:
          mode: ${{ needs.authenticate.outputs.event == 'pull_request' && 'maintainer' || 'merge-group' }}
          pull-request-event: ${{ needs.authenticate.outputs.event == 'pull_request' && steps.change-event.outputs.path || '' }}
          merge-group-event: ${{ needs.authenticate.outputs.event == 'merge_group' && steps.change-event.outputs.path || '' }}
          repo: .
          base: ${{ needs.authenticate.outputs.base-sha }}
          head: ${{ needs.authenticate.outputs.head-sha }}
          policy: .agent-vigil.json
          policy-ref: ${{ needs.authenticate.outputs.base-sha }}
          isolate-candidate: true
          candidate-setup-cmd: npm ci --ignore-scripts
      - name: Retain the customer receipt in the central control repository
        if: always() && steps.vigil.outputs.report != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-vigil-${{ needs.authenticate.outputs.owner }}-${{ needs.authenticate.outputs.name }}-${{ needs.authenticate.outputs.head-sha }}
          path: |
            ${{ steps.vigil.outputs.report }}
            ${{ steps.vigil.outputs.sarif }}
            ${{ steps.vigil.outputs.value-card }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish App-owned decision
    needs: [authenticate, evidence]
    if: always() && needs.authenticate.result == 'success'
    runs-on: ubuntu-24.04
    environment: agent-vigil-public-app
    steps:
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.AGENT_VIGIL_PUBLIC_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENT_VIGIL_PUBLIC_APP_PRIVATE_KEY }}
          owner: ${{ needs.authenticate.outputs.owner }}
          repositories: ${{ needs.authenticate.outputs.name }}
          permission-checks: write
          permission-contents: read
          permission-pull-requests: read
      - name: Recheck live identity and complete the queued check
        env:
          APP_TOKEN: ${{ steps.token.outputs.token }}
          TARGET_REPOSITORY: ${{ needs.authenticate.outputs.repository }}
          EVENT_KIND: ${{ needs.authenticate.outputs.event }}
          PR_NUMBER: ${{ needs.authenticate.outputs.number }}
          BASE_SHA: ${{ needs.authenticate.outputs.base-sha }}
          HEAD_SHA: ${{ needs.authenticate.outputs.head-sha }}
          BASE_REF: ${{ needs.authenticate.outputs.base-ref }}
          HEAD_REF: ${{ needs.authenticate.outputs.head-ref }}
          CHECK_RUN_ID: ${{ needs.authenticate.outputs.check-run-id }}
          EVIDENCE_RESULT: ${{ needs.evidence.result }}
          VIGIL_STATUS: ${{ needs.evidence.outputs.vigil-status }}
          RECEIPT_HASH: ${{ needs.evidence.outputs.receipt-hash }}
          EXPECTED_PR_BODY_SHA256: ${{ needs.evidence.outputs.pr-body-sha256 }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          const e = process.env;
          async function request(path, options = {}) {
            const response = await fetch(`${e.GITHUB_API_URL}${path}`, {
              ...options,
              headers: { Accept: "application/vnd.github+json", Authorization: `Bearer ${e.APP_TOKEN}`, "X-GitHub-Api-Version": "2026-03-10", ...options.headers },
            });
            const body = await response.text();
            if (!response.ok) throw new Error(`GitHub API ${response.status}: ${body.slice(0, 256)}`);
            return body ? JSON.parse(body) : undefined;
          }
          let current = false;
          if (e.EVENT_KIND === "pull_request") {
            const pull = await request(`/repos/${e.TARGET_REPOSITORY}/pulls/${e.PR_NUMBER}`);
            const body = pull?.body ?? "";
            const bodyCurrent = /^[0-9a-f]{64}$/.test(e.EXPECTED_PR_BODY_SHA256 ?? "")
              && typeof body === "string"
              && createHash("sha256").update(body, "utf8").digest("hex") === e.EXPECTED_PR_BODY_SHA256;
            current = pull?.state === "open" && pull?.base?.sha === e.BASE_SHA && pull?.head?.sha === e.HEAD_SHA && bodyCurrent;
          } else {
            try {
              const ref = e.HEAD_REF.replace(/^refs\//, "");
              const value = await request(`/repos/${e.TARGET_REPOSITORY}/git/ref/${ref}`);
              current = value?.object?.type === "commit" && value?.object?.sha === e.HEAD_SHA;
            } catch { current = false; }
          }
          const receiptValid = /^sha256:[0-9a-f]{64}$/.test(e.RECEIPT_HASH ?? "");
          const status = current && e.EVIDENCE_RESULT === "success" && e.VIGIL_STATUS === "PASS" && receiptValid
            ? "PASS"
            : current && e.VIGIL_STATUS === "FAIL" ? "FAIL" : "NOT CHECKED";
          const conclusion = status === "PASS" ? "success" : "failure";
          const summary = status === "PASS"
            ? "Independent verification passed for the exact current commit."
            : status === "FAIL" ? "Independent verification found a blocking contradiction."
            : "No merge decision was possible because required evidence or a current commit identity was missing.";
          await request(`/repos/${e.TARGET_REPOSITORY}/check-runs/${e.CHECK_RUN_ID}`, {
            method: "PATCH",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ status: "completed", conclusion, details_url: `${e.GITHUB_SERVER_URL}/${e.GITHUB_REPOSITORY}/actions/runs/${e.GITHUB_RUN_ID}`, output: { title: status, summary } }),
          });
          if (status !== "PASS") process.exitCode = 1;
          NODE
