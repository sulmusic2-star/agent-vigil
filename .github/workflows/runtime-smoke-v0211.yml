name: v0.21.1 runtime smoke

on:
  push:
    branches: [codex/v0211-hosted-smoke-candidate]

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          package-manager-cache: false
      - id: vigil
        uses: sulmusic2-star/agent-vigil@fe3c5fb68b764a2511f388f0cc712b0558a0ada6
        with:
          mode: prove
          attest: false
          repo: .
          head: ${{ github.sha }}
      - name: Verify proof exists
        env:
          REPORT: ${{ steps.vigil.outputs.report }}
        run: test -n "$REPORT" && test -s "$REPORT"
      - name: Retain the exact hosted proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v0.21.1-hosted-runtime-proof-${{ github.run_id }}
          path: |
            ${{ steps.vigil.outputs.report }}
            ${{ steps.vigil.outputs.control-proof-predicate }}
          if-no-files-found: error
          retention-days: 30
