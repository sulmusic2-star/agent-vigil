name: Publish hermetic candidate runner

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: image-tags
        name: Bind image tags to the exact source
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          repository='ghcr.io/sulmusic2-star/agent-vigil-runner'
          tags="$repository:sha-${GITHUB_SHA}"
          if [[ "$EVENT_NAME" == "push" ]]; then
            [[ "$REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]
            version="${BASH_REMATCH[1]}"
            package_version=$(node -p 'JSON.parse(require("node:fs").readFileSync("package.json", "utf8")).version')
            [[ "$package_version" == "$version" ]]
            tags+=$'\n'"$repository:$version"
          fi
          {
            echo 'value<<AGENT_VIGIL_TAGS'
            printf '%s\n' "$tags"
            echo 'AGENT_VIGIL_TAGS'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: runners/common
          file: runners/common/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.image-tags.outputs.value }}
      - name: Record the immutable digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'runner=ghcr.io/sulmusic2-star/agent-vigil-runner@%s\n' "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
