name: Weekly control proof

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Challenge the installed control
        run: node dist/cli.js prove --repo . --base "$GITHUB_SHA" --output "$RUNNER_TEMP/control-proof.json"
      - id: predicate
        name: Prepare the privacy-reduced control-proof predicate
        if: always()
        run: |
          node dist/cli.js attest-control "$RUNNER_TEMP/control-proof.json" --predicate-output "$RUNNER_TEMP/control-proof-predicate.json"
          echo "path=$RUNNER_TEMP/control-proof-predicate.json" >> "$GITHUB_OUTPUT"
      - id: attestation
        name: Sign the exact control proof with GitHub OIDC
        if: always() && steps.predicate.outputs.path != ''
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: ${{ runner.temp }}/control-proof.json
          predicate-type: https://sulmusic2-star.github.io/agent-vigil/control-proof-predicate-v1.schema.json
          predicate-path: ${{ steps.predicate.outputs.path }}
      - name: Build the weekly certificate bundle
        run: |
          node dist/cli.js certify record "$RUNNER_TEMP/control-proof.json" --organization sulmusic2-star --repository sulmusic2-star/agent-vigil --required-check "Agent Vigil evidence" --output "$RUNNER_TEMP/control-certificate.json"
          node dist/cli.js certify add "$RUNNER_TEMP/control-certificate.json" --corpus "$RUNNER_TEMP/control-corpus.jsonl"
          node dist/cli.js certify policy --organization sulmusic2-star --repository sulmusic2-star/agent-vigil --required-check "Agent Vigil evidence" --pack authority --output "$RUNNER_TEMP/control-policy.json"
          node dist/cli.js certify status --corpus "$RUNNER_TEMP/control-corpus.jsonl" --policy "$RUNNER_TEMP/control-policy.json" --output "$RUNNER_TEMP/control-status.json"
      - uses: actions/upload-artifact@v7
        with:
          name: control-certificate-${{ github.run_id }}
          retention-days: 90
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/control-proof.json
            ${{ runner.temp }}/control-proof-predicate.json
            ${{ steps.attestation.outputs.bundle-path }}
            ${{ runner.temp }}/control-certificate.json
            ${{ runner.temp }}/control-corpus.jsonl
            ${{ runner.temp }}/control-policy.json
            ${{ runner.temp }}/control-status.json
