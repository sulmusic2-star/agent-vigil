name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  candidate-ci:
    name: Candidate CI (not trusted evidence) / Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Check out the candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Select Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Type-check
        run: npm run typecheck
      - name: Build the candidate bundle
        run: npm run build
      - name: Run the candidate test suite
        run: npm test
      - name: Enforce the coverage floor
        if: matrix.node == 22
        run: npm run test:coverage
      - name: Check the public surface
        if: matrix.node == 22
        run: npm run review:public
      - name: Exercise the packed package
        if: matrix.node == 20 || matrix.node == 22
        run: npm run test:package
      - name: Replay public historical failures
        if: matrix.node == 22
        run: npm run proof:historical
      - name: Verify the failure-pattern corpus
        if: matrix.node == 22
        run: npm run proof:failure-corpus
      - name: Rehearse the npm package without lifecycle scripts
        if: matrix.node == 22
        run: npm pack --ignore-scripts --dry-run

  portability:
    name: Candidate portability (not trusted evidence) / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022]
    steps:
      - name: Keep repository and disposable-fixture text byte-stable
        run: git config --global core.autocrlf false
      - name: Check out the candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Select Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Type-check
        run: npm run typecheck
      - name: Build the candidate bundle
        run: npm run build
      - name: Run the candidate test suite
        run: npm test

  candidate-isolation-regression:
    name: Candidate Docker isolation regression (not trusted evidence)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the candidate revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Select Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Preload and inspect the exact candidate sandbox image
        env:
          CANDIDATE_IMAGE: node@sha256:46e94f8cf91baab69a2deb3153e74eeffd73c20c7cc1d8432f5b96469eaa0322
        run: |
          set -euo pipefail
          docker pull "$CANDIDATE_IMAGE"
          docker image inspect --format '{{json .RepoDigests}}' "$CANDIDATE_IMAGE" \
            | grep -F -- "\"$CANDIDATE_IMAGE\""
      - name: Run the real-Docker escape regression
        env:
          AGENT_VIGIL_REQUIRE_REAL_DOCKER: "true"
        run: node --import tsx --test test/action-runtime-security.test.ts
      - name: Run protected group regression under a non-reaping PID 1
        env:
          CANDIDATE_IMAGE: node@sha256:46e94f8cf91baab69a2deb3153e74eeffd73c20c7cc1d8432f5b96469eaa0322
        run: |
          set -euo pipefail
          container="agent-vigil-zombie-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker run --detach --name "$container" \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/workspace,readonly" \
            --workdir /workspace \
            "$CANDIDATE_IMAGE" sleep 300 >/dev/null
          cleanup() { docker rm -f "$container" >/dev/null; }
          trap cleanup EXIT
          docker exec --env AGENT_VIGIL_REQUIRE_LINUX_THREAD_FIXTURE=true "$container" \
            node --import tsx --test --test-concurrency=1 \
            --test-name-pattern="wall limit terminates an ordinary descendant|a leader cannot leave an ordinary same-group descendant|a zombie process leader cannot hide a runnable worker thread|changing Linux task membership is not accepted as zombie-only|hidepid-inaccessible unrelated processes do not poison group evidence" \
            test/run-supervisor.test.ts
