name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Enforce coverage floor
        if: matrix.node == 22
        run: npm run test:coverage
      - run: npm pack --dry-run
      - name: Install packed package across repository shapes
        if: matrix.node == 22
        run: npm run test:package
      - name: Replay public historical failures
        if: matrix.node == 22
        run: npm run proof:historical
      - name: Dogfood Agent Vigil
        uses: ./
        with:
          transcript: examples/demo-pass.md
          repo: .
          base: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          head: ${{ github.event.pull_request.head.sha || 'HEAD' }}
          strict: true
      - name: Dogfood malformed-transcript failure
        id: malformed
        continue-on-error: true
        uses: ./
        with:
          transcript: examples/malformed.jsonl
          repo: .
          base: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          head: ${{ github.event.pull_request.head.sha || 'HEAD' }}
          strict: true
      - name: Assert malformed transcript failed closed
        if: always()
        env:
          STEP_OUTCOME: ${{ steps.malformed.outcome }}
          VIGIL_STATUS: ${{ steps.malformed.outputs.status }}
        run: test "$STEP_OUTCOME" = "failure" && test "$VIGIL_STATUS" = "INCONCLUSIVE"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: agent-vigil-receipt-node-${{ matrix.node }}
          path: |
            agent-vigil-report.json
            agent-vigil.sarif
          if-no-files-found: warn

  portability:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dogfood Agent Vigil
        uses: ./
        with:
          transcript: examples/demo-pass.md
          repo: .
          base: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          head: ${{ github.event.pull_request.head.sha || 'HEAD' }}
          strict: true
      - run: npm run build
      - run: npm test
