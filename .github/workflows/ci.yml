name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Smoke the Ubuntu hosted-runtime trust contract
        if: matrix.node == 22
        shell: /usr/bin/env -u BASH_ENV -u ENV /bin/bash --noprofile --norc -e -o pipefail {0}
        run: |
          node_real=$(/usr/bin/readlink -f -- "$(command -v node)")
          [[ "$node_real" =~ ^/opt/hostedtoolcache/node/[0-9]+\.[0-9]+\.[0-9]+/x64/bin/node$ ]]
          [[ -f "$node_real" && ! -L "$node_real" && -x "$node_real" ]]
          mode=$(/usr/bin/stat -c '%a' -- "$node_real")
          [[ "$mode" =~ ^[0-7]{3,4}$ ]]
          (( (8#$mode & 022) == 0 ))
          [[ -w /opt/hostedtoolcache ]]
          /usr/bin/env -i LANG=C LC_ALL=C TZ=UTC "$node_real" -e \
            'if(Number(process.versions.node.split(".")[0])<20)process.exit(1)'
          /usr/bin/git --no-pager --version
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Enforce coverage floor
        if: matrix.node == 22
        run: npm run test:coverage
      - run: npm pack --dry-run
      - name: Check public wording and typography
        if: matrix.node == 22
        run: npm run review:public
      - name: Install packed package across repository shapes
        if: matrix.node == 22
        run: npm run test:package
      - name: Replay public historical failures
        if: matrix.node == 22
        run: npm run proof:historical
      - name: Dogfood Agent Vigil
        id: dogfood
        uses: ./
        with:
          transcript: examples/demo-pass.md
          repo: .
          base: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          head: ${{ github.event.pull_request.head.sha || 'HEAD' }}
          strict: true
      - name: Dogfood malformed-transcript failure
        id: malformed
        continue-on-error: true
        uses: ./
        with:
          transcript: examples/malformed.jsonl
          repo: .
          base: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          head: ${{ github.event.pull_request.head.sha || 'HEAD' }}
          strict: true
      - name: Assert malformed transcript failed closed
        if: always()
        env:
          STEP_OUTCOME: ${{ steps.malformed.outcome }}
          VIGIL_STATUS: ${{ steps.malformed.outputs.status }}
        run: test "$STEP_OUTCOME" = "failure" && test "$VIGIL_STATUS" = "INCONCLUSIVE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always() && steps.dogfood.outputs.report != ''
        with:
          name: agent-vigil-receipt-node-${{ matrix.node }}
          path: |
            ${{ steps.dogfood.outputs.report }}
            ${{ steps.dogfood.outputs.sarif }}
            ${{ steps.dogfood.outputs.github-evidence }}
            ${{ steps.dogfood.outputs.value-card }}
          if-no-files-found: error

  portability:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Dogfood Agent Vigil
        uses: ./
        with:
          transcript: examples/demo-pass.md
          repo: .
          base: ${{ github.event.pull_request.base.sha || 'HEAD~1' }}
          head: ${{ github.event.pull_request.head.sha || 'HEAD' }}
          strict: true
      - run: npm run build
