name: Agent toolchain upgrade preflight

on:
  # Keep the installed file at .github/workflows/agent-vigil-upgrade.yml.
  # pull_request_target selects this workflow from the protected base branch;
  # the job below never executes files from the pull request.
  pull_request_target:
    paths:
      - apm.lock.yaml
      - .agent-vigil/upgrade/**
      - .github/workflows/agent-vigil-upgrade.yml

permissions:
  contents: read

jobs:
  upgrade-preflight:
    name: Agent toolchain upgrade preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
          # checkout v7 requires this opt-out before it will materialize a fork
          # head under pull_request_target. Nothing in this job may execute,
          # source, import, build, or run files from that checkout.
          allow-unsafe-pr-checkout: true

      # Upgrade Guard never pulls an image inside the comparison. Keep this
      # exact-digest cache mutation visible and separate from the receipt.
      - name: Preload exact contained runner
        run: >-
          docker pull
          node:22.22.3-bookworm-slim@sha256:16d364eebf6b62da439dc993d9b80940c78b0ca38438452f011ab9a25c752644

      - id: vigil
        uses: sulmusic2-star/agent-vigil@v0.15.0
        with:
          mode: upgrade
          repo: .
          base: ${{ github.event.pull_request.base.sha }}
          head: ${{ github.event.pull_request.head.sha }}

      # The report is a private wrapper containing exact manifest and canary
      # commitments. Do not upload it from a public repository. A private
      # repository may add an explicitly reviewed, access-controlled artifact
      # step after choosing an appropriate retention policy.
