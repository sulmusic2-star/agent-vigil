        runtime_fingerprint=$(file_fingerprint "$VIGIL_RUNTIME_DIR") || exit 2
        readonly action_real VIGIL_CLI_SOURCE cli_source_fingerprint cli_source_sha runtime_fingerprint
        AGENT_VIGIL_INTERNAL_TEST_PATH="$VIGIL_RUNTIME_DIR:$VIGIL_SAFE_PATH"
        AGENT_VIGIL_INTERNAL_TEST_HOME="$VIGIL_TEST_HOME"
        AGENT_VIGIL_INTERNAL_GIT_BIN="$VIGIL_GIT_BIN"
