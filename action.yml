            exit 2
          fi
        elif [[ "$VIGIL_ISOLATE_CANDIDATE" == "true" ]]; then
          echo "agent-vigil: candidate isolation applies only to repository-executing verification modes" >&2
          exit 2
        fi
        if [[ -n "$VIGIL_CANDIDATE_SETUP_COMMAND" ]]; then
