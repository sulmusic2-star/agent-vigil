          ) || return 1
          IFS=$'\t' read -r mode type object <<< "$metadata"
          [[ ( "$mode" == 100644 || "$mode" == 100755 ) && "$type" == blob \
            && ( "$object" =~ ^[0-9a-f]{40}$ || "$object" =~ ^[0-9a-f]{64}$ ) ]] || return 1
          size=$("$VIGIL_ENV_BIN" -i LANG=C LC_ALL=C TZ=UTC PATH=/usr/bin:/bin HOME="$VIGIL_TEST_HOME" \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_SYSTEM=/dev/null GIT_CONFIG_GLOBAL=/dev/null \
            GIT_NO_REPLACE_OBJECTS=1 GIT_OPTIONAL_LOCKS=0 GIT_TERMINAL_PROMPT=0 \
            "$VIGIL_GIT_BIN" --no-pager --no-replace-objects \
              -c core.hooksPath=/dev/null -c core.fsmonitor=false -c core.attributesFile=/dev/null \
              -C "$VIGIL_REPO" cat-file -s "$object" 2>>"$verifier_log") || return 1
          [[ "$size" =~ ^[0-9]+$ && "$size" -le "$maximum" ]] || return 1
          "$VIGIL_ENV_BIN" -i LANG=C LC_ALL=C TZ=UTC PATH=/usr/bin:/bin HOME="$VIGIL_TEST_HOME" \
            GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_SYSTEM=/dev/null GIT_CONFIG_GLOBAL=/dev/null \
            GIT_NO_REPLACE_OBJECTS=1 GIT_OPTIONAL_LOCKS=0 GIT_TERMINAL_PROMPT=0 \
            "$VIGIL_GIT_BIN" --no-pager --no-replace-objects \
              -c core.hooksPath=/dev/null -c core.fsmonitor=false -c core.attributesFile=/dev/null \
              -C "$VIGIL_REPO" cat-file blob "$object" > "$destination" 2>>"$verifier_log" || return 1
          "$VIGIL_CHMOD_BIN" 400 "$destination"
          actual_size=$("$VIGIL_STAT_BIN" -c '%s' -- "$destination" 2>/dev/null) || \
            actual_size=$("$VIGIL_STAT_BIN" -f '%z' "$destination" 2>/dev/null) || return 1
          [[ "$actual_size" == "$size" && -f "$destination" && ! -L "$destination" ]] || return 1
        }
        snapshot_regular_json() {
          "$VIGIL_ENV_BIN" -i LANG=C LC_ALL=C TZ=UTC \
            "$VIGIL_NODE_BIN" - "$1" "$2" "$3" 2>>"$verifier_log" <<'NODE'
        const fs = require("node:fs");
        const path = require("node:path");
        const source = path.resolve(process.argv[2]);
        const destination = path.resolve(process.argv[3]);
        const maximum = BigInt(process.argv[4]);
        const root = path.parse(source).root;
        let current = root;
        for (const part of path.relative(root, path.dirname(source)).split(path.sep).filter(Boolean)) {
          current = path.join(current, part);
          const status = fs.lstatSync(current);
          if (status.isSymbolicLink() || !status.isDirectory()) process.exit(2);
        }
        const before = fs.lstatSync(source, { bigint: true });
        if (before.isSymbolicLink() || !before.isFile() || before.size < 2n || before.size > maximum) process.exit(2);
        const descriptor = fs.openSync(source, fs.constants.O_RDONLY | fs.constants.O_NOFOLLOW | fs.constants.O_NONBLOCK);
        let raw;
        try {
          const opened = fs.fstatSync(descriptor, { bigint: true });
          if (!opened.isFile() || opened.dev !== before.dev || opened.ino !== before.ino || opened.size !== before.size
            || opened.mtimeNs !== before.mtimeNs || opened.ctimeNs !== before.ctimeNs) process.exit(2);
          raw = Buffer.alloc(Number(opened.size));
          let offset = 0;
          while (offset < raw.length) {
            const count = fs.readSync(descriptor, raw, offset, raw.length - offset, offset);
            if (count === 0) process.exit(2);
            offset += count;
          }
          const after = fs.fstatSync(descriptor, { bigint: true });
          const finalPath = fs.lstatSync(source, { bigint: true });
          if (after.dev !== opened.dev || after.ino !== opened.ino || after.size !== opened.size
            || after.mtimeNs !== opened.mtimeNs || after.ctimeNs !== opened.ctimeNs
            || finalPath.isSymbolicLink() || !finalPath.isFile()
            || finalPath.dev !== opened.dev || finalPath.ino !== opened.ino || finalPath.size !== opened.size
            || finalPath.mtimeNs !== opened.mtimeNs || finalPath.ctimeNs !== opened.ctimeNs) process.exit(2);
        } finally { fs.closeSync(descriptor); }
        const parsed = JSON.parse(raw.toString("utf8"));
        if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) process.exit(2);
