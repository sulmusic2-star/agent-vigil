name: "Agent Vigil"
description: "Fail-closed evidence receipt for AI coding-agent sessions"
author: "Tim Sullivan"
branding:
  icon: "shield"
  color: "green"
inputs:
  mode:
    description: "Set to maintainer for PR-attestation mode; transcript and receipt modes use their named inputs"
    required: false
  transcript:
    description: "Agent transcript (.jsonl) or summary (.md)"
    required: false
  receipt:
    description: "Compact signed portable receipt; use instead of transcript"
    required: false
  repo:
    description: "Repository path to verify"
    required: false
    default: "."
  base:
    description: "Baseline commit"
    required: false
    default: "HEAD~1"
  head:
    description: "Head commit"
    required: false
    default: "HEAD"
  test-cmd:
    description: "Explicit test command; executes repository code"
    required: false
  policy:
    description: "Policy JSON path (defaults to .agent-vigil.json when present)"
    required: false
  policy-ref:
    description: "Trusted Git ref to load the policy from (recommended: pull request base SHA)"
    required: false
  strict:
    description: "Treat unresolved claims as INCONCLUSIVE"
    required: false
    default: "true"
  min-verified:
    description: "Minimum objective verified claims"
    required: false
    default: "1"
outputs:
  status:
    description: "PASS, FAIL, or INCONCLUSIVE"
    value: ${{ steps.vigil.outputs.status }}
  receipt-hash:
    description: "Deterministic SHA-256 receipt identifier"
    value: ${{ steps.vigil.outputs.receipt_hash }}
  report:
    description: "Path to the JSON receipt"
    value: ${{ steps.vigil.outputs.report }}
  sarif:
    description: "Path to the SARIF report when a receipt was produced"
    value: ${{ steps.vigil.outputs.sarif }}
runs:
  using: "composite"
  steps:
    - id: vigil
      shell: bash
      env:
        VIGIL_TRANSCRIPT: ${{ inputs.transcript }}
        VIGIL_RECEIPT: ${{ inputs.receipt }}
        VIGIL_MODE: ${{ inputs.mode }}
        VIGIL_REPO: ${{ inputs.repo }}
        VIGIL_BASE: ${{ inputs.base }}
        VIGIL_HEAD: ${{ inputs.head }}
        VIGIL_TEST_CMD: ${{ inputs.test-cmd }}
        VIGIL_POLICY: ${{ inputs.policy }}
        VIGIL_POLICY_REF: ${{ inputs.policy-ref }}
        VIGIL_STRICT: ${{ inputs.strict }}
        VIGIL_MIN_VERIFIED: ${{ inputs.min-verified }}
      run: |
        if [[ -n "$VIGIL_MODE" && "$VIGIL_MODE" != "maintainer" ]]; then
          echo "agent-vigil: mode must be maintainer when provided" >&2
          exit 2
        fi
        selected=0
        [[ -n "$VIGIL_TRANSCRIPT" ]] && selected=$((selected + 1))
        [[ -n "$VIGIL_RECEIPT" ]] && selected=$((selected + 1))
        [[ "$VIGIL_MODE" == "maintainer" ]] && selected=$((selected + 1))
        if [[ "$selected" -ne 1 ]]; then
          echo "agent-vigil: choose exactly one of transcript, receipt, or mode: maintainer" >&2
          exit 2
        fi
        if [[ -n "$VIGIL_RECEIPT" && ( -z "$VIGIL_POLICY" || -z "$VIGIL_POLICY_REF" ) ]]; then
          echo "agent-vigil: receipt mode requires a base-anchored policy and policy-ref" >&2
          exit 2
        fi
        if [[ "$VIGIL_MODE" == "maintainer" && ( -z "$VIGIL_POLICY" || -z "$VIGIL_POLICY_REF" ) ]]; then
          echo "agent-vigil: maintainer mode requires a base-anchored policy and policy-ref" >&2
          exit 2
        fi

        # On pull requests, the event payload is the trust root. Candidate
        # workflow edits must not redirect verification to different commits or
        # to a policy from the candidate branch.
        if [[ -n "${GITHUB_EVENT_PATH:-}" && -f "$GITHUB_EVENT_PATH" ]]; then
          IFS=$'\t' read -r event_kind event_base event_head < <(node -e '
            const e = require(process.env.GITHUB_EVENT_PATH);
            const kind = e.pull_request ? "pull_request" : e.merge_group ? "merge_group" : "";
            const base = e.pull_request?.base?.sha ?? e.merge_group?.base_sha ?? "";
            const head = e.pull_request?.head?.sha ?? e.merge_group?.head_sha ?? "";
            process.stdout.write(`${kind}\t${base}\t${head}\n`);
          ')
          if [[ -n "$event_base" ]]; then
            if [[ "$VIGIL_BASE" != "$event_base" || "$VIGIL_HEAD" != "$event_head" ]]; then
              echo "agent-vigil: GitHub event verification must use event base $event_base and head $event_head" >&2
              exit 2
            fi
            if [[ -n "$VIGIL_POLICY_REF" && "$VIGIL_POLICY_REF" != "$event_base" ]]; then
              echo "agent-vigil: policy-ref must equal GitHub event base $event_base" >&2
              exit 2
            fi
            if [[ -n "$VIGIL_POLICY" && "$VIGIL_POLICY" != ".agent-vigil.json" ]]; then
              echo "agent-vigil: GitHub event policy path must be .agent-vigil.json" >&2
              exit 2
            fi
            if [[ -n "$VIGIL_POLICY" && -z "$VIGIL_POLICY_REF" ]]; then
              echo "agent-vigil: GitHub event policy requires policy-ref anchored to event base $event_base" >&2
              exit 2
            fi
          fi
        fi

        artifact_dir=$(node -e 'const {mkdtempSync}=require("node:fs"); const {join}=require("node:path"); process.stdout.write(mkdtempSync(join(process.env.RUNNER_TEMP || process.cwd(), "agent-vigil-")))')
        report_file="$artifact_dir/report.json"
        sarif_file="$artifact_dir/report.sarif"
        if [[ "${event_kind:-}" == "merge_group" ]]; then
          if [[ -z "$VIGIL_POLICY" || -z "$VIGIL_POLICY_REF" ]]; then
            echo "agent-vigil: merge-group verification requires a base-anchored policy and policy-ref" >&2
            exit 2
          fi
          args=(merge-group --event "$GITHUB_EVENT_PATH" --repo "$VIGIL_REPO" --base "$VIGIL_BASE" --head "$VIGIL_HEAD" --output "$report_file" --sarif "$sarif_file" --github-summary)
        elif [[ "$VIGIL_MODE" == "maintainer" ]]; then
          if [[ -z "${GITHUB_EVENT_PATH:-}" || ! -f "$GITHUB_EVENT_PATH" ]]; then
            echo "agent-vigil: maintainer mode requires a readable GitHub pull_request event" >&2
            exit 2
          fi
          args=(maintainer --event "$GITHUB_EVENT_PATH" --repo "$VIGIL_REPO" --base "$VIGIL_BASE" --head "$VIGIL_HEAD" --output "$report_file" --sarif "$sarif_file" --github-summary)
        elif [[ -n "$VIGIL_RECEIPT" ]]; then
          args=(gate "$VIGIL_RECEIPT" --repo "$VIGIL_REPO" --base "$VIGIL_BASE" --head "$VIGIL_HEAD" --output "$report_file" --sarif "$sarif_file" --github-summary)
        else
          args=("$VIGIL_TRANSCRIPT" --repo "$VIGIL_REPO" --base "$VIGIL_BASE" --head "$VIGIL_HEAD" --output "$report_file" --sarif "$sarif_file" --github-summary --min-verified "$VIGIL_MIN_VERIFIED")
          if [[ -n "$VIGIL_TEST_CMD" ]]; then args+=(--test-cmd "$VIGIL_TEST_CMD"); fi
          if [[ "$VIGIL_STRICT" == "true" ]]; then args+=(--strict); fi
        fi
        if [[ -n "$VIGIL_POLICY" ]]; then args+=(--policy "$VIGIL_POLICY"); fi
        if [[ -n "$VIGIL_POLICY_REF" ]]; then args+=(--policy-ref "$VIGIL_POLICY_REF"); fi

        set +e
        node "$GITHUB_ACTION_PATH/dist/cli.js" "${args[@]}"
        code=$?
        set -e

        if [[ -s "$report_file" ]]; then
          status=$(node -e 'const r=require(process.argv[1]); process.stdout.write(r.summary.status)' "$report_file")
          receipt_hash=$(node -e 'const r=require(process.argv[1]); process.stdout.write(r.receiptHash)' "$report_file")
          cp "$report_file" agent-vigil-report.json
          if [[ -s "$sarif_file" ]]; then cp "$sarif_file" agent-vigil.sarif; fi
          report_path="$PWD/agent-vigil-report.json"
          sarif_path="$PWD/agent-vigil.sarif"
        else
          # Preserve the verifier's original diagnostic and exit code when
          # parsing or configuration fails before a receipt can be written.
          status="INCONCLUSIVE"
          receipt_hash="unavailable"
          report_path=""
          sarif_path=""
        fi
        {
          echo "status=$status"
          echo "receipt_hash=$receipt_hash"
          echo "report=$report_path"
          echo "sarif=$sarif_path"
        } >> "$GITHUB_OUTPUT"
        exit "$code"
