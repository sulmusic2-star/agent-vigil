        readonly AGENT_VIGIL_INTERNAL_TEST_PATH AGENT_VIGIL_INTERNAL_TEST_HOME AGENT_VIGIL_INTERNAL_GIT_BIN

        node_checkpoint_is_intact() {
          local current_fingerprint current_mode current_sha
