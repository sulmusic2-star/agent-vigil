        node_checkpoint_fingerprint=$(file_fingerprint "$VIGIL_NODE_BIN") || exit 2
        readonly VIGIL_RUNTIME_DIR VIGIL_NODE_BIN VIGIL_TEST_HOME node_source_before node_source_after node_source_sha expected_node_source_sha node_checkpoint_sha checkpoint_mode node_checkpoint_fingerprint
        observed_node_version=$("$VIGIL_ENV_BIN" -i LANG=C LC_ALL=C TZ=UTC "$VIGIL_NODE_BIN" -p 'process.versions.node') || true
        if [[ ! "$observed_node_version" =~ ^22\.[0-9]+\.[0-9]+$ ]]; then
