          [[ "$current_fingerprint" == "$runtime_fingerprint" ]] || return 1
          [[ -f "$VIGIL_NODE_BIN" && ! -L "$VIGIL_NODE_BIN" && -x "$VIGIL_NODE_BIN" ]] || return 1
          current_mode=$(file_mode "$VIGIL_NODE_BIN") || return 1
          [[ "$current_mode" == 500 || "$current_mode" == 0500 ]] || return 1
          current_fingerprint=$(file_fingerprint "$VIGIL_NODE_BIN") || return 1
          [[ "$current_fingerprint" == "$node_checkpoint_fingerprint" ]] || return 1
          if [[ "$VIGIL_SHA_BIN" == */sha256sum ]]; then
            current_sha=$("$VIGIL_SHA_BIN" "$VIGIL_NODE_BIN" | { read -r digest _; printf '%s' "$digest"; })
          else
            current_sha=$("$VIGIL_SHA_BIN" -a 256 "$VIGIL_NODE_BIN" | { read -r digest _; printf '%s' "$digest"; })
          fi
          [[ "$current_sha" == "$node_checkpoint_sha" ]]
        }
        action_cli_is_intact() {
          local current_fingerprint current_sha
