name: "Agent Vigil"
description: "Fail-closed change control and evidence receipts for AI coding agents"
author: "Tim Sullivan"
branding:
  icon: "shield"
  color: "green"
inputs:
  attest:
    description: "Create a GitHub/Sigstore attestation for the receipt; caller must grant id-token and attestations write permissions"
    required: false
    default: "false"
  mode:
    description: "Set to plan, prove, maintainer, outcome, or upgrade for the corresponding evidence mode"
    required: false
  outcome-receipt:
    description: "Full receipt from the prior Agent Vigil run; required in outcome mode"
    required: false
  actions-run-id:
    description: "GitHub Actions run ID to import in outcome mode"
    required: false
  transcript:
    description: "Agent transcript (.jsonl) or summary (.md)"
    required: false
  receipt:
    description: "Compact signed portable receipt; use instead of transcript"
    required: false
  authority-contract:
    description: "Task-scoped authority contract; requires transcript and authority-contract-ref"
    required: false
  authority-contract-ref:
    description: "Trusted Git ref containing the authority contract (use the pull request base SHA)"
    required: false
  repo:
    description: "Repository path to verify"
    required: false
    default: "."
  base:
    description: "Baseline commit"
    required: false
    default: "HEAD~1"
  head:
    description: "Head commit"
    required: false
    default: "HEAD"
  test-cmd:
    description: "Explicit test command; executes repository code"
    required: false
  policy:
    description: "Policy JSON path (defaults to .agent-vigil.json when present)"
    required: false
  policy-ref:
    description: "Trusted Git ref to load the policy from (recommended: pull request base SHA)"
    required: false
  strict:
    description: "Treat unresolved claims as INCONCLUSIVE"
    required: false
    default: "true"
  min-verified:
    description: "Minimum objective verified claims"
    required: false
    default: "1"
  github-token:
    description: "Optional GitHub token used only for read-only PR review evidence collection"
    required: false
  value-task-class:
    description: "Optional task class for retained Agent Value Cards"
    required: false
  value-budget-usd:
    description: "Optional predeclared task budget"
    required: false
  value-cost-usd:
    description: "Optional attributed task cost; requires value-cost-source"
    required: false
  value-cost-source:
    description: "provider-billed, subscription-allocated, or user-estimated"
    required: false
  value-cost-evidence:
    description: "Optional local billing artifact hashed into the Value Card"
    required: false
  value-review-minutes:
    description: "Optional explicit human review duration"
    required: false
  revert-commit-evidence:
    description: "Optional GitHub commit JSON explicitly linked as revert evidence"
    required: false
  hotfix-pr-evidence:
    description: "Optional GitHub pull-request JSON explicitly linked as hotfix evidence"
    required: false
  incident-issue-evidence:
    description: "Optional GitHub issue JSON explicitly linked as incident evidence"
    required: false
outputs:
  status:
    description: "PASS, FAIL, INCONCLUSIVE, BLOCK, HOLD, SAFE, or CHANGED"
    value: ${{ steps.vigil.outputs.status }}
  receipt-hash:
    description: "Deterministic SHA-256 receipt or authority-plan identifier"
    value: ${{ steps.vigil.outputs.receipt_hash }}
  report:
    description: "Path to the JSON receipt or authority plan"
    value: ${{ steps.vigil.outputs.report }}
  sarif:
    description: "Path to the SARIF report when a receipt was produced"
    value: ${{ steps.vigil.outputs.sarif }}
  value-card:
    description: "Path to the retained Agent Value Card JSON when produced"
    value: ${{ steps.vigil.outputs.value_card }}
  value-verdict:
    description: "POSITIVE, NEGATIVE, or INCONCLUSIVE when a Value Card was produced"
    value: ${{ steps.vigil.outputs.value_verdict }}
  github-evidence:
    description: "Path to the normalized hash-bound GitHub evidence bundle when produced"
    value: ${{ steps.vigil.outputs.github_evidence }}
  attestation-url:
    description: "GitHub URL for the signed receipt attestation when attest is true"
    value: ${{ steps.github_attestation.outputs.attestation-url }}
  attestation-id:
    description: "GitHub attestation ID when attest is true"
    value: ${{ steps.github_attestation.outputs.attestation-id }}
  attestation-bundle:
    description: "Local Sigstore bundle path when attest is true"
    value: ${{ steps.github_attestation.outputs.bundle-path }}
runs:
  using: "composite"
  steps:
    - id: vigil
      shell: /usr/bin/env -u BASH_ENV -u ENV -u SHELLOPTS -u BASHOPTS -u POSIXLY_CORRECT /bin/bash --noprofile --norc -e -o pipefail {0}
      env:
        BASH_ENV: ""
        ENV: ""
        SHELLOPTS: ""
        BASHOPTS: ""
        PS4: ""
        BASH_XTRACEFD: ""
        CDPATH: ""
        GLOBIGNORE: ""
        POSIXLY_CORRECT: ""
        LD_PRELOAD: ""
        LD_LIBRARY_PATH: ""
        LD_AUDIT: ""
        GCONV_PATH: ""
        LOCPATH: ""
        NLSPATH: ""
        DYLD_INSERT_LIBRARIES: ""
        DYLD_LIBRARY_PATH: ""
        DYLD_FRAMEWORK_PATH: ""
        OPENSSL_CONF: ""
        OPENSSL_MODULES: ""
        NODE_OPTIONS: ""
        NODE_PATH: ""
        PATH: /usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin
        VIGIL_TRANSCRIPT: ${{ inputs.mode != 'upgrade' && inputs.transcript || '' }}
        VIGIL_ATTEST: ${{ inputs.attest }}
        VIGIL_RECEIPT: ${{ inputs.mode != 'upgrade' && inputs.receipt || '' }}
        VIGIL_AUTHORITY_CONTRACT: ${{ inputs.mode != 'upgrade' && inputs.authority-contract || '' }}
        VIGIL_AUTHORITY_CONTRACT_REF: ${{ inputs.mode != 'upgrade' && inputs.authority-contract-ref || '' }}
        VIGIL_MODE: ${{ inputs.mode }}
        VIGIL_OUTCOME_RECEIPT: ${{ inputs.mode != 'upgrade' && inputs.outcome-receipt || '' }}
        VIGIL_ACTIONS_RUN_ID: ${{ inputs.mode != 'upgrade' && inputs.actions-run-id || '' }}
        VIGIL_REPO: ${{ inputs.repo }}
        VIGIL_BASE: ${{ inputs.base }}
        VIGIL_HEAD: ${{ inputs.head }}
        VIGIL_TEST_CMD: ${{ inputs.mode != 'upgrade' && inputs.test-cmd || '' }}
        VIGIL_POLICY: ${{ inputs.mode != 'upgrade' && inputs.policy || '' }}
        VIGIL_POLICY_REF: ${{ inputs.mode != 'upgrade' && inputs.policy-ref || '' }}
        VIGIL_STRICT: ${{ inputs.strict }}
        VIGIL_MIN_VERIFIED: ${{ inputs.min-verified }}
        VIGIL_GITHUB_TOKEN: ${{ inputs.mode != 'upgrade' && inputs.github-token || '' }}
        VIGIL_UPGRADE_HAS_GITHUB_TOKEN: ${{ inputs.mode == 'upgrade' && inputs.github-token != '' && 'true' || 'false' }}
        VIGIL_VALUE_TASK_CLASS: ${{ inputs.mode != 'upgrade' && inputs.value-task-class || '' }}
        VIGIL_VALUE_BUDGET_USD: ${{ inputs.mode != 'upgrade' && inputs.value-budget-usd || '' }}
        VIGIL_VALUE_COST_USD: ${{ inputs.mode != 'upgrade' && inputs.value-cost-usd || '' }}
        VIGIL_VALUE_COST_SOURCE: ${{ inputs.mode != 'upgrade' && inputs.value-cost-source || '' }}
        VIGIL_VALUE_COST_EVIDENCE: ${{ inputs.mode != 'upgrade' && inputs.value-cost-evidence || '' }}
        VIGIL_VALUE_REVIEW_MINUTES: ${{ inputs.mode != 'upgrade' && inputs.value-review-minutes || '' }}
        VIGIL_REVERT_EVIDENCE: ${{ inputs.mode != 'upgrade' && inputs.revert-commit-evidence || '' }}
        VIGIL_HOTFIX_EVIDENCE: ${{ inputs.mode != 'upgrade' && inputs.hotfix-pr-evidence || '' }}
        VIGIL_INCIDENT_EVIDENCE: ${{ inputs.mode != 'upgrade' && inputs.incident-issue-evidence || '' }}
      run: |
        /usr/bin/env -i \
          LANG=C LC_ALL=C TZ=UTC PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin \
          "GITHUB_ACTION_PATH=${GITHUB_ACTION_PATH-}" \
          "GITHUB_EVENT_PATH=${GITHUB_EVENT_PATH-}" \
          "GITHUB_WORKSPACE=${GITHUB_WORKSPACE-}" \
          "GITHUB_OUTPUT=${GITHUB_OUTPUT-}" \
          "GITHUB_STEP_SUMMARY=${GITHUB_STEP_SUMMARY-}" \
          "GITHUB_REPOSITORY=${GITHUB_REPOSITORY-}" \
          "RUNNER_TEMP=${RUNNER_TEMP-}" \
          "VIGIL_TRANSCRIPT=${VIGIL_TRANSCRIPT-}" \
          "VIGIL_ATTEST=${VIGIL_ATTEST-}" \
          "VIGIL_RECEIPT=${VIGIL_RECEIPT-}" \
          "VIGIL_AUTHORITY_CONTRACT=${VIGIL_AUTHORITY_CONTRACT-}" \
          "VIGIL_AUTHORITY_CONTRACT_REF=${VIGIL_AUTHORITY_CONTRACT_REF-}" \
          "VIGIL_MODE=${VIGIL_MODE-}" \
          "VIGIL_OUTCOME_RECEIPT=${VIGIL_OUTCOME_RECEIPT-}" \
          "VIGIL_ACTIONS_RUN_ID=${VIGIL_ACTIONS_RUN_ID-}" \
          "VIGIL_REPO=${VIGIL_REPO-}" \
          "VIGIL_BASE=${VIGIL_BASE-}" \
          "VIGIL_HEAD=${VIGIL_HEAD-}" \
          "VIGIL_TEST_CMD=${VIGIL_TEST_CMD-}" \
          "VIGIL_POLICY=${VIGIL_POLICY-}" \
          "VIGIL_POLICY_REF=${VIGIL_POLICY_REF-}" \
          "VIGIL_STRICT=${VIGIL_STRICT-}" \
          "VIGIL_MIN_VERIFIED=${VIGIL_MIN_VERIFIED-}" \
          "VIGIL_GITHUB_TOKEN=${VIGIL_GITHUB_TOKEN-}" \
          "VIGIL_UPGRADE_HAS_GITHUB_TOKEN=${VIGIL_UPGRADE_HAS_GITHUB_TOKEN-}" \
          "VIGIL_VALUE_TASK_CLASS=${VIGIL_VALUE_TASK_CLASS-}" \
          "VIGIL_VALUE_BUDGET_USD=${VIGIL_VALUE_BUDGET_USD-}" \
          "VIGIL_VALUE_COST_USD=${VIGIL_VALUE_COST_USD-}" \
          "VIGIL_VALUE_COST_SOURCE=${VIGIL_VALUE_COST_SOURCE-}" \
          "VIGIL_VALUE_COST_EVIDENCE=${VIGIL_VALUE_COST_EVIDENCE-}" \
          "VIGIL_VALUE_REVIEW_MINUTES=${VIGIL_VALUE_REVIEW_MINUTES-}" \
          "VIGIL_REVERT_EVIDENCE=${VIGIL_REVERT_EVIDENCE-}" \
          "VIGIL_HOTFIX_EVIDENCE=${VIGIL_HOTFIX_EVIDENCE-}" \
          "VIGIL_INCIDENT_EVIDENCE=${VIGIL_INCIDENT_EVIDENCE-}" \
          /bin/bash --noprofile --norc -e -o pipefail -s <<'AGENT_VIGIL_TRUSTED_BOOTSTRAP'
        set -eo pipefail
        set +x
        umask 077
        export BASH_ENV='' ENV='' PS4='' BASH_XTRACEFD='' CDPATH='' GLOBIGNORE=''
        unset POSIXLY_CORRECT
        export LD_PRELOAD='' LD_LIBRARY_PATH='' LD_AUDIT=''
        export DYLD_INSERT_LIBRARIES='' DYLD_LIBRARY_PATH='' DYLD_FRAMEWORK_PATH=''
        export OPENSSL_CONF='' OPENSSL_MODULES='' NODE_OPTIONS='' NODE_PATH=''
        readonly VIGIL_SAFE_PATH='/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin'
        export PATH="$VIGIL_SAFE_PATH"
        unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES
        unset GIT_COMMON_DIR GIT_NAMESPACE GIT_CEILING_DIRECTORIES GIT_DISCOVERY_ACROSS_FILESYSTEM
        unset GIT_CONFIG GIT_CONFIG_GLOBAL GIT_CONFIG_SYSTEM GIT_CONFIG_COUNT GIT_ATTR_NOSYSTEM
        unset GIT_SSH GIT_SSH_COMMAND GIT_ASKPASS SSH_ASKPASS GIT_PROXY_COMMAND

        # The fixed host files below are part of the GitHub-hosted runner image
        # trust boundary. Writable ancestors are permitted because Ubuntu runner
        # images intentionally expose writable tool roots; arbitrary PATH,
        # workspace, Action, and runner-temp executables remain ineligible.
        readonly VIGIL_HOSTED_NODE_ROOT='/opt/hostedtoolcache/node'
        readonly VIGIL_MACOS_HOSTED_NODE_ROOT='/Users/runner/hostedtoolcache/node'

        bootstrap_host_file() {
          local selected="$1" parent canonical_parent
          parent="${selected%/*}"
          canonical_parent=$(cd "$parent" 2>/dev/null && pwd -P) || return 1
          selected="$canonical_parent/${selected##*/}"
          [[ "$selected" == "$1" && -f "$selected" && ! -L "$selected" && -x "$selected" && ! -w "$selected" ]] || return 1
          printf '%s' "$selected"
        }

        VIGIL_STAT_BIN=$(bootstrap_host_file /usr/bin/stat) || {
          echo "agent-vigil: trusted host stat is unavailable" >&2
          exit 2
        }
        file_mode() {
          local selected="$1" mode
          mode=$("$VIGIL_STAT_BIN" -c '%a' -- "$selected" 2>/dev/null) || \
            mode=$("$VIGIL_STAT_BIN" -f '%Lp' "$selected" 2>/dev/null) || return 1
          [[ "$mode" =~ ^[0-7]{3,4}$ ]] || return 1
          printf '%s' "$mode"
        }
        file_fingerprint() {
          local selected="$1" value
          value=$("$VIGIL_STAT_BIN" -c '%d:%i:%s:%Y:%a' -- "$selected" 2>/dev/null) || \
            value=$("$VIGIL_STAT_BIN" -f '%d:%i:%z:%m:%Lp' "$selected" 2>/dev/null) || return 1
          [[ "$value" =~ ^[0-9]+:[0-9]+:[0-9]+:[0-9]+:[0-7]{3,4}$ ]] || return 1
          printf '%s' "$value"
        }
        path_is_inside() {
          local selected="$1" root="$2"
          [[ -n "$root" && ( "$selected" == "$root" || "$selected" == "$root"/* ) ]]
        }
        canonical_host_file() {
          local selected="$1" parent canonical_parent mode
          parent="${selected%/*}"
          canonical_parent=$(cd "$parent" 2>/dev/null && pwd -P) || return 1
          selected="$canonical_parent/${selected##*/}"
          [[ "$selected" == "$1" && -f "$selected" && ! -L "$selected" && -x "$selected" ]] || return 1
          mode=$(file_mode "$selected") || return 1
          (( (8#$mode & 022) == 0 )) || return 1
          if path_is_inside "$selected" "${GITHUB_WORKSPACE:-}" \
            || path_is_inside "$selected" "${RUNNER_TEMP:-}" \
            || path_is_inside "$selected" "${GITHUB_ACTION_PATH:-}"; then return 1; fi
          printf '%s' "$selected"
        }
        valid_node_source() {
          local selected="$1" relative version architecture
          case "$selected" in
            /usr/bin/node|/usr/local/bin/node) return 0 ;;
            "$VIGIL_HOSTED_NODE_ROOT"/*/x64/bin/node)
              relative="${selected#"$VIGIL_HOSTED_NODE_ROOT"/}"
              version="${relative%%/*}"
              [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
                && (( 10#${version%%.*} >= 20 ))
              ;;
            "$VIGIL_MACOS_HOSTED_NODE_ROOT"/*/*/bin/node)
              relative="${selected#"$VIGIL_MACOS_HOSTED_NODE_ROOT"/}"
              version="${relative%%/*}"
              architecture="${relative#*/}"; architecture="${architecture%%/*}"
              [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ \
                && ( "$architecture" == x64 || "$architecture" == arm64 ) ]] \
                && (( 10#${version%%.*} >= 20 ))
              ;;
            *) return 1 ;;
          esac
        }

        VIGIL_ENV_BIN=$(canonical_host_file /usr/bin/env) || true
        VIGIL_GIT_BIN=$(canonical_host_file /usr/bin/git) || true
        VIGIL_MKTEMP_BIN=$(canonical_host_file /usr/bin/mktemp) || true
        VIGIL_CP_BIN=''
        for candidate in /usr/bin/cp /bin/cp; do
          if resolved=$(canonical_host_file "$candidate"); then VIGIL_CP_BIN="$resolved"; break; fi
        done
        VIGIL_CHMOD_BIN=''
        for candidate in /usr/bin/chmod /bin/chmod; do
          if resolved=$(canonical_host_file "$candidate"); then VIGIL_CHMOD_BIN="$resolved"; break; fi
        done
        VIGIL_CMP_BIN=$(canonical_host_file /usr/bin/cmp) || true
        VIGIL_RM_BIN=''
        for candidate in /usr/bin/rm /bin/rm; do
          if resolved=$(canonical_host_file "$candidate"); then VIGIL_RM_BIN="$resolved"; break; fi
        done
        VIGIL_SHA_BIN=''
        for candidate in /usr/bin/sha256sum /usr/bin/shasum; do
          if resolved=$(canonical_host_file "$candidate"); then VIGIL_SHA_BIN="$resolved"; break; fi
        done
        VIGIL_NODE_SOURCE=''
        for candidate in \
          "$VIGIL_HOSTED_NODE_ROOT"/*/x64/bin/node \
          "$VIGIL_MACOS_HOSTED_NODE_ROOT"/*/x64/bin/node \
          "$VIGIL_MACOS_HOSTED_NODE_ROOT"/*/arm64/bin/node \
          /usr/bin/node \
          /usr/local/bin/node; do
          if resolved=$(canonical_host_file "$candidate") && valid_node_source "$resolved"; then
            VIGIL_NODE_SOURCE="$resolved"
            break
          fi
        done
        if [[ -z "$VIGIL_ENV_BIN" || -z "$VIGIL_GIT_BIN" || -z "$VIGIL_MKTEMP_BIN" \
          || -z "$VIGIL_CP_BIN" || -z "$VIGIL_CHMOD_BIN" || -z "$VIGIL_CMP_BIN" \
          || -z "$VIGIL_RM_BIN" || -z "$VIGIL_SHA_BIN" || -z "$VIGIL_NODE_SOURCE" ]]; then
          missing_runtime=''
          [[ -n "$VIGIL_ENV_BIN" ]] || missing_runtime+=' env'
          [[ -n "$VIGIL_GIT_BIN" ]] || missing_runtime+=' git'
          [[ -n "$VIGIL_MKTEMP_BIN" ]] || missing_runtime+=' mktemp'
          [[ -n "$VIGIL_CP_BIN" ]] || missing_runtime+=' cp'
          [[ -n "$VIGIL_CHMOD_BIN" ]] || missing_runtime+=' chmod'
          [[ -n "$VIGIL_CMP_BIN" ]] || missing_runtime+=' cmp'
          [[ -n "$VIGIL_RM_BIN" ]] || missing_runtime+=' rm'
          [[ -n "$VIGIL_SHA_BIN" ]] || missing_runtime+=' sha256'
          [[ -n "$VIGIL_NODE_SOURCE" ]] || missing_runtime+=' node'
          echo "agent-vigil: trusted host runtime is unavailable:$missing_runtime" >&2
          exit 2
        fi
        readonly VIGIL_STAT_BIN VIGIL_ENV_BIN VIGIL_GIT_BIN VIGIL_MKTEMP_BIN VIGIL_CP_BIN
        readonly VIGIL_CHMOD_BIN VIGIL_CMP_BIN VIGIL_RM_BIN VIGIL_SHA_BIN VIGIL_NODE_SOURCE

        if [[ -z "${RUNNER_TEMP:-}" || ! -d "$RUNNER_TEMP" || -L "$RUNNER_TEMP" ]]; then
          echo "agent-vigil: runner-owned temporary directory is unavailable" >&2
          exit 2
        fi
        runner_real=$(cd "$RUNNER_TEMP" 2>/dev/null && pwd -P) || exit 2
        [[ "$RUNNER_TEMP" == "$runner_real" ]] || exit 2
        VIGIL_RUNTIME_DIR=$("$VIGIL_MKTEMP_BIN" -d "$runner_real/agent-vigil-runtime.XXXXXX") || exit 2
        [[ "$VIGIL_RUNTIME_DIR" == "$runner_real"/agent-vigil-runtime.[A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9] \
          && -d "$VIGIL_RUNTIME_DIR" && ! -L "$VIGIL_RUNTIME_DIR" && -O "$VIGIL_RUNTIME_DIR" ]] || exit 2
        "$VIGIL_CHMOD_BIN" 700 "$VIGIL_RUNTIME_DIR"
        cleanup_runtime() {
          [[ -n "${VIGIL_RUNTIME_DIR:-}" && "$VIGIL_RUNTIME_DIR" == "$runner_real"/agent-vigil-runtime.[A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9] \
            && -d "$VIGIL_RUNTIME_DIR" && ! -L "$VIGIL_RUNTIME_DIR" && -O "$VIGIL_RUNTIME_DIR" ]] || return 1
          "$VIGIL_RM_BIN" -rf -- "$VIGIL_RUNTIME_DIR"
          [[ ! -e "$VIGIL_RUNTIME_DIR" && ! -L "$VIGIL_RUNTIME_DIR" ]]
        }
        trap 'cleanup_runtime >/dev/null 2>&1 || true' EXIT
        VIGIL_NODE_BIN="$VIGIL_RUNTIME_DIR/node"
        node_source_before=$(file_fingerprint "$VIGIL_NODE_SOURCE") || exit 2
        if [[ "$VIGIL_SHA_BIN" == */sha256sum ]]; then
          node_source_sha=$("$VIGIL_SHA_BIN" "$VIGIL_NODE_SOURCE" | { read -r digest _; printf '%s' "$digest"; })
        else
          node_source_sha=$("$VIGIL_SHA_BIN" -a 256 "$VIGIL_NODE_SOURCE" | { read -r digest _; printf '%s' "$digest"; })
        fi
        [[ "$node_source_sha" =~ ^[0-9a-f]{64}$ ]] || exit 2
        "$VIGIL_CP_BIN" "$VIGIL_NODE_SOURCE" "$VIGIL_NODE_BIN"
        "$VIGIL_CHMOD_BIN" 500 "$VIGIL_NODE_BIN"
        node_source_after=$(file_fingerprint "$VIGIL_NODE_SOURCE") || exit 2
        [[ "$node_source_before" == "$node_source_after" ]] || exit 2
        if [[ "$VIGIL_SHA_BIN" == */sha256sum ]]; then
          node_checkpoint_sha=$("$VIGIL_SHA_BIN" "$VIGIL_NODE_BIN" | { read -r digest _; printf '%s' "$digest"; })
        else
          node_checkpoint_sha=$("$VIGIL_SHA_BIN" -a 256 "$VIGIL_NODE_BIN" | { read -r digest _; printf '%s' "$digest"; })
        fi
        [[ "$node_checkpoint_sha" == "$node_source_sha" ]] || exit 2
        "$VIGIL_CMP_BIN" -s "$VIGIL_NODE_SOURCE" "$VIGIL_NODE_BIN" || exit 2
        checkpoint_mode=$(file_mode "$VIGIL_NODE_BIN") || exit 2
        [[ "$checkpoint_mode" == 500 || "$checkpoint_mode" == 0500 ]] || exit 2
        readonly VIGIL_RUNTIME_DIR VIGIL_NODE_BIN node_source_before node_source_after node_source_sha node_checkpoint_sha checkpoint_mode
        observed_node_version=$("$VIGIL_ENV_BIN" -i LANG=C LC_ALL=C TZ=UTC "$VIGIL_NODE_BIN" -p 'process.versions.node') || true
        if [[ ! "$observed_node_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ \
          || "${observed_node_version%%.*}" -lt 20 ]]; then
          echo "agent-vigil: trusted Node.js 20 or newer is unavailable" >&2
          exit 2
        fi
        case "$VIGIL_NODE_SOURCE" in
          "$VIGIL_HOSTED_NODE_ROOT"/*/x64/bin/node|"$VIGIL_MACOS_HOSTED_NODE_ROOT"/*/*/bin/node)
            expected_node_version="${VIGIL_NODE_SOURCE#*/node/}"; expected_node_version="${expected_node_version%%/*}"
            [[ "$observed_node_version" == "$expected_node_version" ]] || exit 2
            ;;
        esac
        readonly observed_node_version

        if [[ -n "$VIGIL_MODE" && "$VIGIL_MODE" != "plan" && "$VIGIL_MODE" != "prove" && "$VIGIL_MODE" != "maintainer" && "$VIGIL_MODE" != "outcome" && "$VIGIL_MODE" != "upgrade" ]]; then
          echo "agent-vigil: mode must be plan, prove, maintainer, outcome, or upgrade when provided" >&2
          exit 2
        fi
        if [[ "$VIGIL_MODE" == "plan" && "$VIGIL_ATTEST" == "true" ]]; then
          echo "agent-vigil: plan mode does not yet support attestation" >&2
          exit 2
        fi
        if [[ "$VIGIL_MODE" == "prove" && "$VIGIL_ATTEST" == "true" ]]; then
          echo "agent-vigil: prove mode does not yet support attestation" >&2
          exit 2
        fi
        if [[ "$VIGIL_MODE" == "upgrade" && "$VIGIL_ATTEST" == "true" ]]; then
          echo "agent-vigil: upgrade mode does not yet support attestation" >&2
          exit 2
        fi
        selected=0
        if [[ "$VIGIL_MODE" == "outcome" ]]; then
          if [[ -z "$VIGIL_OUTCOME_RECEIPT" || ! -f "$VIGIL_OUTCOME_RECEIPT" ]]; then
            echo "agent-vigil: outcome mode requires a readable full outcome-receipt" >&2
            exit 2
          fi
          selected=$((selected + 1))
        elif [[ "$VIGIL_MODE" == "prove" ]]; then
          if [[ -n "$VIGIL_TRANSCRIPT" || -n "$VIGIL_RECEIPT" || -n "$VIGIL_AUTHORITY_CONTRACT" || -n "$VIGIL_OUTCOME_RECEIPT" ]]; then
            echo "agent-vigil: prove mode cannot be combined with another evidence input" >&2
            exit 2
          fi
          selected=$((selected + 1))
        elif [[ -n "$VIGIL_AUTHORITY_CONTRACT" ]]; then
          if [[ -z "$VIGIL_TRANSCRIPT" || -z "$VIGIL_AUTHORITY_CONTRACT_REF" ]]; then
            echo "agent-vigil: authority mode requires transcript, authority-contract, and authority-contract-ref" >&2
            exit 2
          fi
          selected=$((selected + 1))
        elif [[ -n "$VIGIL_TRANSCRIPT" ]]; then
          selected=$((selected + 1))
        fi
        [[ -n "$VIGIL_RECEIPT" ]] && selected=$((selected + 1))
        [[ "$VIGIL_MODE" == "plan" ]] && selected=$((selected + 1))
        [[ "$VIGIL_MODE" == "maintainer" ]] && selected=$((selected + 1))
        [[ "$VIGIL_MODE" == "upgrade" ]] && selected=$((selected + 1))
        if [[ "$selected" -ne 1 ]]; then
          echo "agent-vigil: choose exactly one of transcript, authority contract, receipt, plan mode, prove mode, maintainer mode, outcome mode, or upgrade mode" >&2
          exit 2
        fi
        if [[ -n "$VIGIL_RECEIPT" && ( -z "$VIGIL_POLICY" || -z "$VIGIL_POLICY_REF" ) ]]; then
          echo "agent-vigil: receipt mode requires a base-anchored policy and policy-ref" >&2
          exit 2
        fi
        if [[ "$VIGIL_MODE" == "maintainer" && ( -z "$VIGIL_POLICY" || -z "$VIGIL_POLICY_REF" ) ]]; then
          echo "agent-vigil: maintainer mode requires a base-anchored policy and policy-ref" >&2
          exit 2
        fi

        # On pull requests, the event payload is the trust root. Candidate
        # workflow edits must not redirect verification to different commits or
        # to a policy from the candidate branch.
        if [[ -n "${GITHUB_EVENT_PATH:-}" && -f "$GITHUB_EVENT_PATH" ]]; then
          event_identity=$("$VIGIL_ENV_BIN" -i LANG=C LC_ALL=C TZ=UTC \
            "$VIGIL_NODE_BIN" -e '
            const e = require(require("node:path").resolve(process.argv[1]));
            const kind = e.pull_request ? "pull_request" : e.merge_group ? "merge_group" : e.workflow_run ? "workflow_run" : "";
            const base = e.pull_request?.base?.sha ?? e.merge_group?.base_sha ?? "";
            const head = e.pull_request?.head?.sha ?? e.merge_group?.head_sha ?? "";
            process.stdout.write(`${kind}\t${base}\t${head}\n`);
          ' "$GITHUB_EVENT_PATH")
          IFS=$'\t' read -r event_kind event_base event_head <<< "$event_identity"
          if [[ -n "$event_base" && "$VIGIL_MODE" == "prove" && "$VIGIL_HEAD" != "$event_head" ]]; then
            echo "agent-vigil: pull-request control proof must challenge the event head $event_head" >&2
            exit 2
          fi
          if [[ -n "$event_base" && "$VIGIL_MODE" != "outcome" && "$VIGIL_MODE" != "prove" ]]; then
            if [[ "$VIGIL_BASE" != "$event_base" || "$VIGIL_HEAD" != "$event_head" ]]; then
              echo "agent-vigil: GitHub event verification must use event base $event_base and head $event_head" >&2
              exit 2
            fi
            if [[ -n "$VIGIL_POLICY_REF" && "$VIGIL_POLICY_REF" != "$event_base" ]]; then
              echo "agent-vigil: policy-ref must equal GitHub event base $event_base" >&2
              exit 2
            fi
            if [[ -n "$VIGIL_POLICY" && "$VIGIL_POLICY" != ".agent-vigil.json" ]]; then
              echo "agent-vigil: GitHub event policy path must be .agent-vigil.json" >&2
              exit 2
            fi
            if [[ -n "$VIGIL_POLICY" && -z "$VIGIL_POLICY_REF" ]]; then
              echo "agent-vigil: GitHub event policy requires policy-ref anchored to event base $event_base" >&2
              exit 2
            fi
            if [[ -n "$VIGIL_AUTHORITY_CONTRACT_REF" && "$VIGIL_AUTHORITY_CONTRACT_REF" != "$event_base" ]]; then
              echo "agent-vigil: authority-contract-ref must equal GitHub event base $event_base" >&2
              exit 2
            fi
          fi
        fi

        if [[ "$VIGIL_MODE" == "upgrade" ]]; then
          if [[ "${event_kind:-}" != "pull_request" && "${event_kind:-}" != "merge_group" ]]; then
            echo "agent-vigil: upgrade mode requires a pull_request or merge_group event" >&2
            exit 2
          fi
          if [[ -z "${GITHUB_WORKSPACE:-}" || ! -d "$GITHUB_WORKSPACE" || -z "${RUNNER_TEMP:-}" || ! -d "$RUNNER_TEMP" ]]; then
            echo "agent-vigil: upgrade mode requires GitHub-managed workspace and runner directories" >&2
            exit 2
          fi
          repo_real=$(cd "$VIGIL_REPO" 2>/dev/null && pwd -P) || {
            echo "agent-vigil: upgrade repository is unavailable" >&2
            exit 2
          }
          workspace_real=$(cd "$GITHUB_WORKSPACE" 2>/dev/null && pwd -P) || exit 2
          runner_real=$(cd "$RUNNER_TEMP" 2>/dev/null && pwd -P) || exit 2
          if [[ "$GITHUB_WORKSPACE" != "$workspace_real" || "$RUNNER_TEMP" != "$runner_real" ]]; then
            echo "agent-vigil: GitHub workspace and runner paths must be canonical" >&2
            exit 2
          fi
          if [[ "$repo_real" != "$workspace_real" ]]; then
            validated_event_repo=$(
              "$VIGIL_ENV_BIN" -i LANG=C LC_ALL=C TZ=UTC \
                "$VIGIL_NODE_BIN" -e '
                  const fs=require("node:fs"), path=require("node:path");
                  const requested=path.resolve(process.argv[1]), runner=path.resolve(process.argv[2]);
                  const runnerReal=fs.realpathSync(runner), repositoryReal=fs.realpathSync(requested);
                  if(runnerReal!==runner || repositoryReal!==requested) process.exit(2);
                  const relative=path.relative(runnerReal,repositoryReal).split(path.sep).join("/");
                  if(!/^agent-vigil-event-repo\.[A-Za-z0-9]{6}\/event\.git$/.test(relative)) process.exit(2);
                  const parent=path.dirname(repositoryReal);
                  for(const selected of [parent,repositoryReal]){
                    const status=fs.lstatSync(selected);
                    if(!status.isDirectory()||status.isSymbolicLink()||(status.mode&0o077)!==0) process.exit(2);
                    if(typeof process.getuid==="function"&&status.uid!==process.getuid()) process.exit(2);
                  }
                  const expectedConfig="[core]\n\trepositoryformatversion = 0\n\tfilemode = true\n\tbare = true\n";
                  const config=path.join(repositoryReal,"config"), configStatus=fs.lstatSync(config);
                  if(!configStatus.isFile()||configStatus.isSymbolicLink()||fs.readFileSync(config,"utf8")!==expectedConfig) process.exit(2);
                  for(const name of ["objects","refs"]){
                    const status=fs.lstatSync(path.join(repositoryReal,name));
                    if(!status.isDirectory()||status.isSymbolicLink()) process.exit(2);
                  }
                  if(fs.existsSync(path.join(repositoryReal,"objects/info/alternates"))) process.exit(2);
                  process.stdout.write(repositoryReal);
                ' "$VIGIL_REPO" "$RUNNER_TEMP"
            ) || {
              echo "agent-vigil: upgrade repo must be the workspace or an exact private runner-owned event repository" >&2
              exit 2
            }
            [[ "$validated_event_repo" == "$repo_real" ]] || exit 2
            event_git() {
              "$VIGIL_ENV_BIN" -i LANG=C LC_ALL=C TZ=UTC PATH="$VIGIL_SAFE_PATH" \
                GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_SYSTEM=/dev/null \
                GIT_NO_REPLACE_OBJECTS=1 GIT_OPTIONAL_LOCKS=0 GIT_TERMINAL_PROMPT=0 \
                "$VIGIL_GIT_BIN" --no-pager --no-replace-objects \
                -c core.hooksPath=/dev/null -c core.fsmonitor=false \
                -c core.attributesFile=/dev/null -c credential.helper= \
                -C "$repo_real" "$@"
            }
            if [[ "$(event_git rev-parse --is-bare-repository)" != true \
              || "$(event_git rev-parse --verify 'refs/vigil/base^{commit}')" != "$event_base" \
              || "$(event_git rev-parse --verify 'refs/vigil/head^{commit}')" != "$event_head" \
              || "$(event_git for-each-ref --format='%(refname)')" != $'refs/vigil/base\nrefs/vigil/head' \
              || -n "$(event_git remote)" \
              || -n "$(event_git config --local --get-regexp '^(http\.|credential\.|remote\.|url\.|include)' || true)" ]]; then
              echo "agent-vigil: runner-owned event repository does not contain only the exact event objects" >&2
              exit 2
            fi
            event_git cat-file -e "$event_base^{commit}" || exit 2
            event_git cat-file -e "$event_head^{commit}" || exit 2
          elif [[ "$(cd "$VIGIL_REPO" 2>/dev/null && pwd -P)" != "$workspace_real" ]]; then
            echo "agent-vigil: upgrade workspace identity changed" >&2
            exit 2
          fi
          VIGIL_REPO="$repo_real"
          if [[ "${VIGIL_UPGRADE_HAS_GITHUB_TOKEN:-false}" == "true" || -n "$VIGIL_GITHUB_TOKEN" ]]; then
            echo "agent-vigil: upgrade mode does not accept a GitHub token" >&2
            exit 2
          fi
          VIGIL_UPGRADE_LOCK_PATH="apm.lock.yaml"
          VIGIL_UPGRADE_CONFIG=".agent-vigil/upgrade/config.json"
        fi

        if [[ -z "${RUNNER_TEMP:-}" || ! -d "$RUNNER_TEMP" ]]; then
          echo "agent-vigil: runner-owned temporary directory is unavailable" >&2
          exit 2
        fi
        artifact_dir=$("$VIGIL_ENV_BIN" -i LANG=C LC_ALL=C TZ=UTC \
          "$VIGIL_NODE_BIN" -e 'const {mkdtempSync}=require("node:fs"); const {join,resolve}=require("node:path"); process.stdout.write(mkdtempSync(join(resolve(process.argv[1]), "agent-vigil-")))' "$RUNNER_TEMP")
        docker_home="$artifact_dir/docker-home"
        "$VIGIL_ENV_BIN" -i LANG=C LC_ALL=C TZ=UTC \
          "$VIGIL_NODE_BIN" -e 'const fs=require("node:fs"); fs.mkdirSync(process.argv[1], {mode:0o700}); fs.chmodSync(process.argv[1], 0o700)' "$docker_home"
        report_file="$artifact_dir/agent-vigil-report.json"
        sarif_file="$artifact_dir/agent-vigil.sarif"
        if [[ "$VIGIL_MODE" == "outcome" ]]; then
          report_file="$VIGIL_OUTCOME_RECEIPT"
          code=0
        elif [[ "$VIGIL_MODE" == "plan" ]]; then
          args=(plan --repo "$VIGIL_REPO" --base "$VIGIL_BASE" --head "$VIGIL_HEAD" --format json --output "$report_file" --github-summary)
        elif [[ "$VIGIL_MODE" == "prove" ]]; then
          args=(prove --repo "$VIGIL_REPO" --base "$VIGIL_HEAD" --format json --output "$report_file")
        elif [[ "$VIGIL_MODE" == "upgrade" ]]; then
          trusted_inputs="$artifact_dir/trusted-inputs"
          trusted_repo="$trusted_inputs/repository"
          current_lock="$trusted_inputs/current-apm.lock.yaml"
          candidate_lock="$trusted_inputs/candidate-apm.lock.yaml"
          verified_preflight="$artifact_dir/verified-preflight.json"
          if ! "$VIGIL_ENV_BIN" -i LANG=C LC_ALL=C TZ=UTC \
            "$VIGIL_NODE_BIN" "$GITHUB_ACTION_PATH/scripts/materialize-trusted-upgrade-inputs.mjs" materialize \
            --repository "$VIGIL_REPO" --base "$VIGIL_BASE" --head "$VIGIL_HEAD" \
            --output "$trusted_inputs" --git "$VIGIL_GIT_BIN" >/dev/null; then
            echo "agent-vigil: exact trusted Upgrade Guard inputs could not be materialized" >&2
            exit 2
          fi
          cleanup_upgrade_inputs() {
            "$VIGIL_ENV_BIN" -i LANG=C LC_ALL=C TZ=UTC \
              "$VIGIL_NODE_BIN" "$GITHUB_ACTION_PATH/scripts/materialize-trusted-upgrade-inputs.mjs" cleanup \
              --output "$trusted_inputs" --parent "$artifact_dir"
          }
          trap 'cleanup_upgrade_inputs >/dev/null 2>&1 || true; cleanup_runtime >/dev/null 2>&1 || true' EXIT
          args=(upgrade preflight --repo "$trusted_repo" --current-lock "$current_lock" --candidate-lock "$candidate_lock" --config "$VIGIL_UPGRADE_CONFIG" --work-directory "$artifact_dir" --output "$report_file")
        elif [[ "${event_kind:-}" == "merge_group" ]]; then
          if [[ -z "$VIGIL_POLICY" || -z "$VIGIL_POLICY_REF" ]]; then
            echo "agent-vigil: merge-group verification requires a base-anchored policy and policy-ref" >&2
            exit 2
          fi
          args=(merge-group --event "$GITHUB_EVENT_PATH" --repo "$VIGIL_REPO" --base "$VIGIL_BASE" --head "$VIGIL_HEAD" --output "$report_file" --sarif "$sarif_file" --github-summary)
        elif [[ "$VIGIL_MODE" == "maintainer" ]]; then
          if [[ -z "${GITHUB_EVENT_PATH:-}" || ! -f "$GITHUB_EVENT_PATH" ]]; then
            echo "agent-vigil: maintainer mode requires a readable GitHub pull_request event" >&2
            exit 2
          fi
          args=(maintainer --event "$GITHUB_EVENT_PATH" --repo "$VIGIL_REPO" --base "$VIGIL_BASE" --head "$VIGIL_HEAD" --output "$report_file" --sarif "$sarif_file" --github-summary)
        elif [[ -n "$VIGIL_AUTHORITY_CONTRACT" ]]; then
          args=(authority "$VIGIL_TRANSCRIPT" --contract "$VIGIL_AUTHORITY_CONTRACT" --contract-ref "$VIGIL_AUTHORITY_CONTRACT_REF" --repo "$VIGIL_REPO" --base "$VIGIL_BASE" --head "$VIGIL_HEAD" --output "$report_file" --sarif "$sarif_file" --github-summary)
        elif [[ -n "$VIGIL_RECEIPT" ]]; then
          args=(gate "$VIGIL_RECEIPT" --repo "$VIGIL_REPO" --base "$VIGIL_BASE" --head "$VIGIL_HEAD" --output "$report_file" --sarif "$sarif_file" --github-summary)
        else
          args=("$VIGIL_TRANSCRIPT" --repo "$VIGIL_REPO" --base "$VIGIL_BASE" --head "$VIGIL_HEAD" --output "$report_file" --sarif "$sarif_file" --github-summary --min-verified "$VIGIL_MIN_VERIFIED")
          if [[ -n "$VIGIL_TEST_CMD" ]]; then args+=(--test-cmd "$VIGIL_TEST_CMD"); fi
          if [[ "$VIGIL_STRICT" == "true" ]]; then args+=(--strict); fi
        fi
        if [[ "$VIGIL_MODE" != "plan" && "$VIGIL_MODE" != "prove" && "$VIGIL_MODE" != "upgrade" ]]; then
          if [[ -n "$VIGIL_POLICY" ]]; then args+=(--policy "$VIGIL_POLICY"); fi
          if [[ -n "$VIGIL_POLICY_REF" ]]; then args+=(--policy-ref "$VIGIL_POLICY_REF"); fi
        fi

        if [[ "$VIGIL_MODE" != "outcome" ]]; then
          set +e
          if [[ "$VIGIL_MODE" == "upgrade" ]]; then
            "$VIGIL_ENV_BIN" -i LANG=C LC_ALL=C TZ=UTC HOME="$docker_home" DOCKER_HOST=unix:///var/run/docker.sock \
              "$VIGIL_NODE_BIN" "$GITHUB_ACTION_PATH/dist/cli.js" "${args[@]}"
          else
            "$VIGIL_NODE_BIN" "$GITHUB_ACTION_PATH/dist/cli.js" "${args[@]}"
          fi
          code=$?
          set -e
        fi
        if [[ "$VIGIL_MODE" == "upgrade" ]]; then
          set +e
          "$VIGIL_ENV_BIN" -i LANG=C LC_ALL=C TZ=UTC \
            "$VIGIL_NODE_BIN" "$GITHUB_ACTION_PATH/dist/cli.js" upgrade verify-preflight "$report_file" \
            --current-lock "$current_lock" --candidate-lock "$candidate_lock" \
            --repo "$trusted_repo" --config "$VIGIL_UPGRADE_CONFIG" > "$verified_preflight"
          verification_code=$?
          set -e
          verified_status=''
          if [[ "$verification_code" -eq 0 && -s "$verified_preflight" ]]; then
            set +e
            verified_status=$("$VIGIL_ENV_BIN" -i LANG=C LC_ALL=C TZ=UTC \
              "$VIGIL_NODE_BIN" -e '
                const fs=require("node:fs"), path=require("node:path"), selected=path.resolve(process.argv[1]);
                const status=fs.lstatSync(selected), bytes=fs.readFileSync(selected);
                if(!status.isFile()||status.isSymbolicLink()||bytes.length<2||bytes.length>4096)process.exit(2);
                const value=JSON.parse(bytes.toString("utf8")), keys=Object.keys(value).sort();
                if(JSON.stringify(keys)!==JSON.stringify(["receiptHash","schemaVersion","valid","verdict"])||
                  value.schemaVersion!=="agent-vigil-apm-preflight/v1"||value.valid!==true||
                  !["SAFE","CHANGED","HOLD"].includes(value.verdict)||
                  !/^sha256:[0-9a-f]{64}$/.test(value.receiptHash))process.exit(2);
                process.stdout.write(value.verdict);
              ' "$verified_preflight")
            verification_parse_code=$?
            set -e
          else
            verification_parse_code=2
          fi
          case "$verified_status" in
            SAFE) expected_preflight_code=0 ;;
            CHANGED) expected_preflight_code=1 ;;
            HOLD) expected_preflight_code=2 ;;
            *) expected_preflight_code=99 ;;
          esac
          if [[ "$verification_code" -ne 0 || "$verification_parse_code" -ne 0 || "$code" -ne "$expected_preflight_code" ]]; then
            echo "agent-vigil: automatic preflight receipt or exit-to-verdict binding is invalid" >&2
            "$VIGIL_ENV_BIN" -i LANG=C LC_ALL=C TZ=UTC \
              "$VIGIL_NODE_BIN" -e 'const {unlinkSync}=require("node:fs"); try { unlinkSync(process.argv[1]); } catch {}' "$report_file"
            code=2
          fi
          trap 'cleanup_runtime >/dev/null 2>&1 || true' EXIT
          if ! cleanup_upgrade_inputs >/dev/null 2>&1; then
            echo "agent-vigil: runner-owned trusted-input cleanup failed" >&2
            "$VIGIL_ENV_BIN" -i LANG=C LC_ALL=C TZ=UTC \
              "$VIGIL_NODE_BIN" -e 'const {unlinkSync}=require("node:fs"); try { unlinkSync(process.argv[1]); } catch {}' "$report_file"
            code=2
          fi
        fi

        if [[ -s "$report_file" ]]; then
          if [[ "$VIGIL_MODE" == "plan" ]]; then
            status=$("$VIGIL_NODE_BIN" -e 'const r=require(require("node:path").resolve(process.argv[1])); process.stdout.write(r.status)' "$report_file")
            receipt_hash=$("$VIGIL_NODE_BIN" -e 'const r=require(require("node:path").resolve(process.argv[1])); process.stdout.write(r.planSha256)' "$report_file")
          elif [[ "$VIGIL_MODE" == "prove" ]]; then
            status=$("$VIGIL_NODE_BIN" -e 'const r=require(require("node:path").resolve(process.argv[1])); process.stdout.write(r.status)' "$report_file")
            receipt_hash=$("$VIGIL_NODE_BIN" -e 'const r=require(require("node:path").resolve(process.argv[1])); process.stdout.write(r.receiptHash)' "$report_file")
          elif [[ "$VIGIL_MODE" == "upgrade" ]]; then
            status=$("$VIGIL_ENV_BIN" -i LANG=C LC_ALL=C TZ=UTC \
              "$VIGIL_NODE_BIN" -e 'const r=require(require("node:path").resolve(process.argv[1])); process.stdout.write(r.verdict)' "$verified_preflight")
            receipt_hash=$("$VIGIL_ENV_BIN" -i LANG=C LC_ALL=C TZ=UTC \
              "$VIGIL_NODE_BIN" -e 'const r=require(require("node:path").resolve(process.argv[1])); process.stdout.write(r.receiptHash)' "$verified_preflight")
          else
            status=$("$VIGIL_NODE_BIN" -e 'const r=require(require("node:path").resolve(process.argv[1])); process.stdout.write(r.summary.status)' "$report_file")
            receipt_hash=$("$VIGIL_NODE_BIN" -e 'const r=require(require("node:path").resolve(process.argv[1])); process.stdout.write(r.receiptHash)' "$report_file")
          fi
          report_path="$report_file"
          sarif_path=""
          if [[ "$VIGIL_MODE" != "plan" && "$VIGIL_MODE" != "prove" && "$VIGIL_MODE" != "upgrade" && -s "$sarif_file" ]]; then
            sarif_path="$sarif_file"
          fi

          github_evidence_path=""
          value_card_path=""
          value_verdict=""
          if [[ "$VIGIL_MODE" != "plan" && "$VIGIL_MODE" != "prove" && "$VIGIL_MODE" != "upgrade" && -n "${GITHUB_EVENT_PATH:-}" && -f "$GITHUB_EVENT_PATH" ]]; then
            github_args=(github-evidence --event "$GITHUB_EVENT_PATH" --output "$artifact_dir/agent-vigil-github-evidence.json")
          else
            github_args=()
          fi
          if [[ "$VIGIL_MODE" != "plan" && "$VIGIL_MODE" != "prove" && "$VIGIL_MODE" != "upgrade" && -n "$VIGIL_GITHUB_TOKEN" && -n "${GITHUB_REPOSITORY:-}" && -n "${GITHUB_EVENT_PATH:-}" ]] && command -v gh >/dev/null 2>&1; then
            pr_number=$("$VIGIL_NODE_BIN" -e 'const e=require(process.env.GITHUB_EVENT_PATH); process.stdout.write(String(e.pull_request?.number || e.number || e.workflow_run?.pull_requests?.[0]?.number || ""))')
            run_id="$VIGIL_ACTIONS_RUN_ID"
            if [[ -z "$run_id" && "${event_kind:-}" == "workflow_run" ]]; then
              run_id=$("$VIGIL_NODE_BIN" -e 'const e=require(process.env.GITHUB_EVENT_PATH); process.stdout.write(String(e.workflow_run?.id || ""))')
            fi
            export GH_TOKEN="$VIGIL_GITHUB_TOKEN"
            if [[ -n "$pr_number" ]]; then
              if ! gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" > "$artifact_dir/pull-request.json"; then echo "agent-vigil: could not collect pull request evidence" >&2; exit 2; fi
              if ! gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$pr_number/reviews?per_page=100" | jq -s 'add' > "$artifact_dir/reviews.json"; then echo "agent-vigil: could not collect review evidence" >&2; exit 2; fi
              if ! gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$pr_number/comments?per_page=100" | jq -s 'add' > "$artifact_dir/review-comments.json"; then echo "agent-vigil: could not collect review-comment evidence" >&2; exit 2; fi
              github_args+=(--pull-request "$artifact_dir/pull-request.json" --reviews "$artifact_dir/reviews.json" --review-comments "$artifact_dir/review-comments.json")
            fi
            if [[ -n "$run_id" && "$run_id" =~ ^[0-9]+$ ]]; then
              if ! gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$artifact_dir/actions-run.json"; then echo "agent-vigil: could not collect Actions run evidence" >&2; exit 2; fi
              if ! gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" | jq -s '[.[].jobs[]]' > "$artifact_dir/actions-jobs.json"; then echo "agent-vigil: could not collect Actions job evidence" >&2; exit 2; fi
              github_args+=(--actions-run "$artifact_dir/actions-run.json" --actions-jobs "$artifact_dir/actions-jobs.json")
            fi
            unset GH_TOKEN
          fi
          if [[ "${#github_args[@]}" -gt 0 ]]; then
            [[ -n "$VIGIL_REVERT_EVIDENCE" ]] && github_args+=(--revert-commit "$VIGIL_REVERT_EVIDENCE")
            [[ -n "$VIGIL_HOTFIX_EVIDENCE" ]] && github_args+=(--hotfix-pull-request "$VIGIL_HOTFIX_EVIDENCE")
            [[ -n "$VIGIL_INCIDENT_EVIDENCE" ]] && github_args+=(--incident-issue "$VIGIL_INCIDENT_EVIDENCE")
            set +e
            "$VIGIL_NODE_BIN" "$GITHUB_ACTION_PATH/dist/cli.js" "${github_args[@]}"
            github_code=$?
            set -e
            if [[ "$github_code" -eq 0 && -s "$artifact_dir/agent-vigil-github-evidence.json" ]]; then
              github_evidence_path="$artifact_dir/agent-vigil-github-evidence.json"
            fi
          fi

          if [[ "$VIGIL_MODE" != "plan" && "$VIGIL_MODE" != "prove" && "$VIGIL_MODE" != "upgrade" ]]; then
            value_args=(value "$report_file" --format json --output "$artifact_dir/agent-vigil-value-card.json")
            [[ -n "$github_evidence_path" ]] && value_args+=(--github-evidence "$github_evidence_path")
            [[ -n "$VIGIL_VALUE_TASK_CLASS" ]] && value_args+=(--task-class "$VIGIL_VALUE_TASK_CLASS")
            [[ -n "$VIGIL_VALUE_BUDGET_USD" ]] && value_args+=(--budget-usd "$VIGIL_VALUE_BUDGET_USD")
            [[ -n "$VIGIL_VALUE_COST_USD" ]] && value_args+=(--cost-usd "$VIGIL_VALUE_COST_USD")
            [[ -n "$VIGIL_VALUE_COST_SOURCE" ]] && value_args+=(--cost-source "$VIGIL_VALUE_COST_SOURCE")
            [[ -n "$VIGIL_VALUE_COST_EVIDENCE" ]] && value_args+=(--cost-evidence "$VIGIL_VALUE_COST_EVIDENCE")
            [[ -n "$VIGIL_VALUE_REVIEW_MINUTES" ]] && value_args+=(--review-minutes "$VIGIL_VALUE_REVIEW_MINUTES")
            set +e
            "$VIGIL_NODE_BIN" "$GITHUB_ACTION_PATH/dist/cli.js" "${value_args[@]}"
            value_code=$?
            set -e
            if [[ "$value_code" -le 2 && -s "$artifact_dir/agent-vigil-value-card.json" ]]; then
              value_card_path="$artifact_dir/agent-vigil-value-card.json"
              value_verdict=$("$VIGIL_NODE_BIN" -e 'const c=require(require("node:path").resolve(process.argv[1])); process.stdout.write(c.valueVerdict)' "$artifact_dir/agent-vigil-value-card.json")
              "$VIGIL_NODE_BIN" - "$artifact_dir/agent-vigil-value-card.json" >> "${GITHUB_STEP_SUMMARY:-/dev/null}" <<'NODE'
        const c = require(process.argv[2]);
        const actions = c.github?.actionsRunDurationSeconds === undefined ? "unavailable" : `${c.github.actionsRunDurationSeconds}s run / ${c.github.actionsJobDurationSeconds ?? "?"}s jobs`;
        process.stdout.write(`\n### Agent Value Card: ${c.valueVerdict}\n\n- Verification: ${c.receipt.verificationStatus}\n- Human disposition: ${c.human.disposition}\n- Downstream outcome: ${c.outcome.state}\n- Actions runtime: ${actions}\n- Evidence gaps: ${c.gaps.length}\n- Card: \`${c.cardHash}\`\n`);
        NODE
            fi
          fi
        else
          # Preserve the verifier's original diagnostic and exit code when
          # parsing or configuration fails before a receipt can be written.
          if [[ "$VIGIL_MODE" == "upgrade" ]]; then status="HOLD"; else status="INCONCLUSIVE"; fi
          receipt_hash="unavailable"
          report_path=""
          sarif_path=""
          value_card_path=""
          value_verdict=""
          github_evidence_path=""
        fi
        {
          echo "status=$status"
          echo "receipt_hash=$receipt_hash"
          echo "report=$report_path"
          echo "sarif=$sarif_path"
          echo "value_card=$value_card_path"
          echo "value_verdict=$value_verdict"
          echo "github_evidence=$github_evidence_path"
        } >> "$GITHUB_OUTPUT"
        exit "$code"
        AGENT_VIGIL_TRUSTED_BOOTSTRAP
    - id: prepare_attestation
      name: Prepare privacy-reduced AI Change Receipt predicate
      if: ${{ always() && inputs.mode != 'plan' && inputs.mode != 'prove' && inputs.mode != 'upgrade' && inputs.attest == 'true' && steps.vigil.outputs.report != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
      shell: bash
      env:
        VIGIL_REPORT: ${{ steps.vigil.outputs.report }}
      run: |
        predicate="$RUNNER_TEMP/agent-vigil-attestation-predicate.json"
        node "$GITHUB_ACTION_PATH/dist/cli.js" attest "$VIGIL_REPORT" --predicate-output "$predicate"
        echo "predicate=$predicate" >> "$GITHUB_OUTPUT"
    - id: github_attestation
      name: Sign AI Change Receipt with GitHub
      if: ${{ always() && inputs.attest == 'true' && steps.prepare_attestation.outputs.predicate != '' }}
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        subject-path: ${{ steps.vigil.outputs.report }}
        predicate-type: https://sulmusic2-star.github.io/agent-vigil/ai-change-receipt-predicate-v1.schema.json
        predicate-path: ${{ steps.prepare_attestation.outputs.predicate }}
