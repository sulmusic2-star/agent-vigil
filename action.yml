          fi
          if [[ "$VIGIL_MODE" == "outcome" && -n "$VIGIL_GITHUB_TOKEN" && -n "${GITHUB_REPOSITORY:-}" && -n "${GITHUB_EVENT_PATH:-}" ]] && command -v gh >/dev/null 2>&1; then
            pr_number=$(post_verification_node -e 'const e=require(process.env.GITHUB_EVENT_PATH); process.stdout.write(String(e.pull_request?.number || e.number || e.workflow_run?.pull_requests?.[0]?.number || ""))')
            run_id="$VIGIL_ACTIONS_RUN_ID"
            if [[ -z "$run_id" && "${event_kind:-}" == "workflow_run" ]]; then
              run_id=$(post_verification_node -e 'const e=require(process.env.GITHUB_EVENT_PATH); process.stdout.write(String(e.workflow_run?.id || ""))')
            fi
            export GH_TOKEN="$VIGIL_GITHUB_TOKEN"
            if [[ -n "$pr_number" ]]; then
              if ! gh api "repos/$GITHUB_REPOSITORY/pulls/$pr_number" > "$artifact_dir/pull-request.json"; then echo "agent-vigil: could not collect pull request evidence" >&2; exit 2; fi
              if ! gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$pr_number/reviews?per_page=100" | jq -s 'add' > "$artifact_dir/reviews.json"; then echo "agent-vigil: could not collect review evidence" >&2; exit 2; fi
              if ! gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$pr_number/comments?per_page=100" | jq -s 'add' > "$artifact_dir/review-comments.json"; then echo "agent-vigil: could not collect review-comment evidence" >&2; exit 2; fi
              github_args+=(--pull-request "$artifact_dir/pull-request.json" --reviews "$artifact_dir/reviews.json" --review-comments "$artifact_dir/review-comments.json")
            fi
            if [[ -n "$run_id" && "$run_id" =~ ^[0-9]+$ ]]; then
              if ! gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$artifact_dir/actions-run.json"; then echo "agent-vigil: could not collect Actions run evidence" >&2; exit 2; fi
              if ! gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs?per_page=100" | jq -s '[.[].jobs[]]' > "$artifact_dir/actions-jobs.json"; then echo "agent-vigil: could not collect Actions job evidence" >&2; exit 2; fi
              github_args+=(--actions-run "$artifact_dir/actions-run.json" --actions-jobs "$artifact_dir/actions-jobs.json")
            fi
            unset GH_TOKEN
          fi
          if [[ "${#github_args[@]}" -gt 0 ]]; then
            [[ -n "$VIGIL_REVERT_EVIDENCE" ]] && github_args+=(--revert-commit "$VIGIL_REVERT_EVIDENCE")
            [[ -n "$VIGIL_HOTFIX_EVIDENCE" ]] && github_args+=(--hotfix-pull-request "$VIGIL_HOTFIX_EVIDENCE")
            [[ -n "$VIGIL_INCIDENT_EVIDENCE" ]] && github_args+=(--incident-issue "$VIGIL_INCIDENT_EVIDENCE")
            set +e
            post_verification_node "$VIGIL_CLI_SOURCE" "${github_args[@]}" >> "$verifier_log" 2>&1
            github_code=$?
            set -e
            if [[ "$github_code" -eq 0 && -s "$artifact_dir/agent-vigil-github-evidence.json" && ! -L "$artifact_dir/agent-vigil-github-evidence.json" ]]; then
              github_evidence_path="$artifact_dir/agent-vigil-github-evidence.json"
            fi
          fi

          if [[ "$VIGIL_MODE" != "plan" && "$VIGIL_MODE" != "prove" && "$VIGIL_MODE" != "continuity" ]]; then
            value_args=(value "$report_file" --format json --output "$artifact_dir/agent-vigil-value-card.json")
            [[ -n "$github_evidence_path" ]] && value_args+=(--github-evidence "$github_evidence_path")
            [[ -n "$VIGIL_VALUE_TASK_CLASS" ]] && value_args+=(--task-class "$VIGIL_VALUE_TASK_CLASS")
            [[ -n "$VIGIL_VALUE_BUDGET_USD" ]] && value_args+=(--budget-usd "$VIGIL_VALUE_BUDGET_USD")
            [[ -n "$VIGIL_VALUE_COST_USD" ]] && value_args+=(--cost-usd "$VIGIL_VALUE_COST_USD")
            [[ -n "$VIGIL_VALUE_COST_SOURCE" ]] && value_args+=(--cost-source "$VIGIL_VALUE_COST_SOURCE")
            [[ -n "$VIGIL_VALUE_COST_EVIDENCE" ]] && value_args+=(--cost-evidence "$VIGIL_VALUE_COST_EVIDENCE")
            [[ -n "$VIGIL_VALUE_REVIEW_MINUTES" ]] && value_args+=(--review-minutes "$VIGIL_VALUE_REVIEW_MINUTES")
            set +e
            post_verification_node "$VIGIL_CLI_SOURCE" "${value_args[@]}" >> "$verifier_log" 2>&1
            value_code=$?
            set -e
            if [[ "$value_code" -le 2 && -s "$artifact_dir/agent-vigil-value-card.json" && ! -L "$artifact_dir/agent-vigil-value-card.json" ]]; then
              value_card_path="$artifact_dir/agent-vigil-value-card.json"
              value_verdict=$(post_verification_node -e 'const c=require(require("node:path").resolve(process.argv[1])); process.stdout.write(c.valueVerdict)' "$artifact_dir/agent-vigil-value-card.json")
              post_verification_node - "$artifact_dir/agent-vigil-value-card.json" >> "${GITHUB_STEP_SUMMARY:-/dev/null}" <<'NODE'
        const c = require(process.argv[2]);
        const actions = c.github?.actionsRunDurationSeconds === undefined ? "unavailable" : c.github.actionsRunDurationSeconds + "s run / " + (c.github.actionsJobDurationSeconds ?? "?") + "s jobs";
        process.stdout.write("\n### Agent Value Card: " + c.valueVerdict + "\n\n- Verification: " + c.receipt.verificationStatus + "\n- Human disposition: " + c.human.disposition + "\n- Downstream outcome: " + c.outcome.state + "\n- Actions runtime: " + actions + "\n- Evidence gaps: " + c.gaps.length + "\n- Card: " + c.cardHash + "\n");
        NODE
            fi
          fi

          if [[ "$VIGIL_MODE" == "continuity" ]]; then
            post_verification_node - "$report_file" >> "${GITHUB_STEP_SUMMARY:-/dev/null}" <<'NODE'
        const d = require(process.argv[2]);
        const messages = {
          CURRENT: "Deployment check: allowed. Required records are present and current.",
          HOLD: "Deployment check: stopped. Required records are missing or could not be checked.",
          EXPIRED: "Deployment check: stopped. Required records are too old.",
          REVOKED: "Deployment check: stopped. Later evidence contradicts the earlier approval.",
        };
        process.stdout.write("\n### Agent Vigil: " + d.continuity + "\n\n" + (messages[d.continuity] ?? messages.HOLD) + "\n");
        NODE
          fi
        else
          echo "agent-vigil: verifier produced no bounded regular report" >&2
          code=2
          status=$([[ "$VIGIL_MODE" == "continuity" ]] && echo "HOLD" || echo "INCONCLUSIVE")
          receipt_hash="unavailable"
          report_path=""
          sarif_path=""
          value_card_path=""
          value_verdict=""
          github_evidence_path=""
        fi
        {
          echo "status=$status"
          echo "receipt_hash=$receipt_hash"
          echo "report=$report_path"
          echo "sarif=$sarif_path"
          echo "value_card=$value_card_path"
          echo "value_verdict=$value_verdict"
          echo "github_evidence=$github_evidence_path"
          echo "attestation_predicate=$attestation_predicate_path"
        } >> "$GITHUB_OUTPUT"
        exit "$code"
        AGENT_VIGIL_TRUSTED_BOOTSTRAP
    - id: prepare_attestation
      name: Prepare privacy-reduced control-proof predicate
      if: ${{ always() && inputs.mode != 'continuity' && inputs.mode == 'prove' && inputs.attest == 'true' && steps.vigil.outputs.report != '' }}
      shell: /usr/bin/env -u BASH_ENV -u ENV -u SHELLOPTS -u BASHOPTS -u POSIXLY_CORRECT /bin/bash --noprofile --norc -e -o pipefail {0}
      env:
        VIGIL_REPORT: ${{ steps.vigil.outputs.report }}
        VIGIL_PREDICATE: ${{ steps.vigil.outputs.attestation_predicate }}
      run: |
        set -euo pipefail
        umask 077
        predicate_parent=$(cd "${VIGIL_PREDICATE%/*}" 2>/dev/null && pwd -P)
        [[ -n "$RUNNER_TEMP" && "$VIGIL_PREDICATE" == "$predicate_parent/${VIGIL_PREDICATE##*/}" \
          && "$VIGIL_PREDICATE" == "$RUNNER_TEMP"/agent-vigil-*/agent-vigil-control-proof-predicate.json \
          && -s "$VIGIL_PREDICATE" && ! -L "$VIGIL_PREDICATE" ]]
        echo "predicate=$VIGIL_PREDICATE" >> "$GITHUB_OUTPUT"
        echo "predicate_type=https://sulmusic2-star.github.io/agent-vigil/control-proof-predicate-v1.schema.json" >> "$GITHUB_OUTPUT"
    - id: github_attestation
      name: Sign Agent Vigil control proof with GitHub
      if: ${{ always() && inputs.mode == 'prove' && inputs.attest == 'true' && steps.prepare_attestation.outputs.predicate != '' }}
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
      with:
        subject-path: ${{ steps.vigil.outputs.report }}
        predicate-type: ${{ steps.prepare_attestation.outputs.predicate_type }}
        predicate-path: ${{ steps.prepare_attestation.outputs.predicate }}
