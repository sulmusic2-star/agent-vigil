            current_sha=$("$VIGIL_SHA_BIN" "$VIGIL_CLI_SOURCE" | { read -r digest _; printf '%s' "$digest"; })
          else
            current_sha=$("$VIGIL_SHA_BIN" -a 256 "$VIGIL_CLI_SOURCE" | { read -r digest _; printf '%s' "$digest"; })
