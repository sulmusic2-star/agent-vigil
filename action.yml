        artifact_dir=$("$VIGIL_ENV_BIN" -i LANG=C LC_ALL=C TZ=UTC \
          "$VIGIL_NODE_BIN" -e 'const {mkdtempSync}=require("node:fs"); const {join,resolve}=require("node:path"); process.stdout.write(mkdtempSync(join(resolve(process.argv[1]), "agent-vigil-")))' "$RUNNER_TEMP")
