          exit 2
        fi
        if [[ ( "${VIGIL_HAS_GITHUB_TOKEN:-false}" == "true" || -n "$VIGIL_GITHUB_TOKEN" ) && "$VIGIL_MODE" != "outcome" ]]; then
          echo "agent-vigil: a GitHub token is restricted to the non-executing outcome mode" >&2
          exit 2
        fi
        if [[ "$VIGIL_CANDIDATE_MODE" == "true" \
          && ( -n "$VIGIL_VALUE_COST_EVIDENCE" || -n "$VIGIL_REVERT_EVIDENCE" \
            || -n "$VIGIL_HOTFIX_EVIDENCE" || -n "$VIGIL_INCIDENT_EVIDENCE" ) ]]; then
