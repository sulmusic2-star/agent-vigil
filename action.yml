name: "Agent Vigil"
description: "Fail-closed change control and evidence receipts for AI coding agents"
author: "Tim Sullivan"
branding:
  icon: "shield"
  color: "green"
inputs:
  attest:
    description: "Create a GitHub/Sigstore attestation for non-candidate control-proof mode; caller must grant id-token and attestations write permissions"
    required: false
    default: "false"
  mode:
    description: "Set to plan, prove, maintainer, outcome, or continuity for the corresponding check"
    required: false
  continuity-chain:
    description: "Downloaded continuity history directory; required in continuity mode"
    required: false
  continuity-environment:
    description: "Protected environment named by the continuity policy"
    required: false
    default: "production"
  outcome-receipt:
    description: "Full receipt from the prior Agent Vigil run; required in outcome mode"
    required: false
  actions-run-id:
    description: "GitHub Actions run ID to import in outcome mode"
    required: false
  transcript:
    description: "Agent transcript (.jsonl) or summary (.md)"
    required: false
  receipt:
    description: "Compact signed portable receipt; use instead of transcript"
    required: false
  authority-contract:
    description: "Task-scoped authority contract; requires transcript and authority-contract-ref"
    required: false
  authority-contract-ref:
    description: "Trusted Git ref containing the authority contract (use the pull request base SHA)"
    required: false
  repo:
    description: "Repository path to verify"
    required: false
    default: "."
  base:
    description: "Baseline commit"
    required: false
    default: "HEAD~1"
  head:
    description: "Head commit"
    required: false
    default: "HEAD"
  test-cmd:
    description: "Explicit test command; executes repository code"
    required: false
  isolate-candidate:
    description: "Run repository-controlled setup and test commands inside the fixed candidate-only Docker sandbox"
    required: false
    default: "false"
  candidate-setup-cmd:
    description: "Base-owned dependency setup command; runs once with network in the private candidate clone before networkless tests"
    required: false
  candidate-image:
    description: "Optional base-owned hermetic runner image pinned by sha256 digest; it must provide the standard image Node entry plus the selected toolchain"
    required: false
  policy:
    description: "Policy JSON path (defaults to .agent-vigil.json when present)"
    required: false
  policy-ref:
    description: "Trusted Git ref to load the policy from (recommended: pull request base SHA)"
    required: false
  strict:
    description: "Optional strengthening request; true enables strict handling, while false or empty leaves the trusted policy in control"
    required: false
  min-verified:
    description: "Optional minimum objective verified claims; cannot lower a stricter trusted-policy minimum"
    required: false
  github-token:
    description: "Optional GitHub token used only by outcome mode for read-only PR review evidence collection"
    required: false
  value-task-class:
    description: "Optional task class for retained Agent Value Cards"
    required: false
  value-budget-usd:
    description: "Optional predeclared task budget"
    required: false
  value-cost-usd:
    description: "Optional attributed task cost; requires value-cost-source"
    required: false
  value-cost-source:
    description: "provider-billed, subscription-allocated, or user-estimated"
    required: false
  value-cost-evidence:
    description: "Optional local billing artifact hashed into the Value Card"
    required: false
  value-review-minutes:
    description: "Optional explicit human review duration"
    required: false
  revert-commit-evidence:
    description: "Optional GitHub commit JSON explicitly linked as revert evidence"
    required: false
  hotfix-pr-evidence:
    description: "Optional GitHub pull-request JSON explicitly linked as hotfix evidence"
    required: false
  incident-issue-evidence:
    description: "Optional GitHub issue JSON explicitly linked as incident evidence"
    required: false
outputs:
  status:
    description: "PASS, FAIL, INCONCLUSIVE, BLOCK, HOLD, CURRENT, EXPIRED, or REVOKED"
    value: ${{ steps.vigil.outputs.status }}
  receipt-hash:
    description: "Deterministic SHA-256 receipt or authority-plan identifier"
    value: ${{ steps.vigil.outputs.receipt_hash }}
  report:
    description: "Path to the JSON receipt or authority plan"
    value: ${{ steps.vigil.outputs.report }}
  sarif:
    description: "Path to the SARIF report when a receipt was produced"
    value: ${{ steps.vigil.outputs.sarif }}
  value-card:
    description: "Path to the retained Agent Value Card JSON when produced"
    value: ${{ steps.vigil.outputs.value_card }}
  value-verdict:
    description: "POSITIVE, NEGATIVE, or INCONCLUSIVE when a Value Card was produced"
    value: ${{ steps.vigil.outputs.value_verdict }}
  github-evidence:
    description: "Path to the normalized hash-bound GitHub evidence bundle when produced"
    value: ${{ steps.vigil.outputs.github_evidence }}
  control-proof-predicate:
    description: "Path to the bounded privacy-reduced predicate produced in prove mode"
    value: ${{ steps.vigil.outputs.attestation_predicate }}
  attestation-url:
    description: "GitHub URL for the signed receipt attestation when attest is true"
    value: ${{ steps.github_attestation.outputs.attestation-url }}
  attestation-id:
    description: "GitHub attestation ID when attest is true"
    value: ${{ steps.github_attestation.outputs.attestation-id }}
  attestation-bundle:
    description: "Local Sigstore bundle path when attest is true"
    value: ${{ steps.github_attestation.outputs.bundle-path }}
runs:
  using: "composite"
  steps:
    - id: vigil
      shell: /usr/bin/env -u BASH_ENV -u ENV -u SHELLOPTS -u BASHOPTS -u POSIXLY_CORRECT /bin/bash --noprofile --norc -e -o pipefail {0}
      env:
        BASH_ENV: ""
        ENV: ""
        SHELLOPTS: ""
        BASHOPTS: ""
        PS4: ""
        BASH_XTRACEFD: ""
        CDPATH: ""
        GLOBIGNORE: ""
        POSIXLY_CORRECT: ""
        LD_PRELOAD: ""
        LD_LIBRARY_PATH: ""
        LD_AUDIT: ""
        GCONV_PATH: ""
        LOCPATH: ""
        NLSPATH: ""
        DYLD_INSERT_LIBRARIES: ""
        DYLD_LIBRARY_PATH: ""
        DYLD_FRAMEWORK_PATH: ""
        OPENSSL_CONF: ""
        OPENSSL_MODULES: ""
        NODE_OPTIONS: ""
        NODE_PATH: ""
        PATH: /usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin
        VIGIL_TRANSCRIPT: ${{ inputs.transcript }}
        VIGIL_ATTEST: ${{ inputs.attest }}
        VIGIL_RECEIPT: ${{ inputs.receipt }}
        VIGIL_AUTHORITY_CONTRACT: ${{ inputs.authority-contract }}
        VIGIL_AUTHORITY_CONTRACT_REF: ${{ inputs.authority-contract-ref }}
        VIGIL_MODE: ${{ inputs.mode }}
        VIGIL_CONTINUITY_CHAIN: ${{ inputs.continuity-chain }}
        VIGIL_CONTINUITY_ENVIRONMENT: ${{ inputs.continuity-environment }}
        VIGIL_OUTCOME_RECEIPT: ${{ inputs.outcome-receipt }}
        VIGIL_ACTIONS_RUN_ID: ${{ inputs.actions-run-id }}
        VIGIL_REPO: ${{ inputs.repo }}
        VIGIL_BASE: ${{ inputs.base }}
        VIGIL_HEAD: ${{ inputs.head }}
        VIGIL_TEST_CMD: ${{ inputs.test-cmd }}
        VIGIL_ISOLATE_CANDIDATE: ${{ inputs.isolate-candidate }}
        VIGIL_CANDIDATE_SETUP_COMMAND: ${{ inputs.isolate-candidate == 'true' && inputs.candidate-setup-cmd || '' }}
        VIGIL_CANDIDATE_IMAGE_INPUT: ${{ inputs.isolate-candidate == 'true' && inputs.candidate-image || '' }}
        VIGIL_POLICY: ${{ inputs.policy }}
        VIGIL_POLICY_REF: ${{ inputs.policy-ref }}
        VIGIL_STRICT: ${{ inputs.strict }}
        VIGIL_MIN_VERIFIED: ${{ inputs.min-verified }}
        VIGIL_GITHUB_TOKEN: ${{ inputs.mode == 'outcome' && inputs.github-token || '' }}
        VIGIL_HAS_GITHUB_TOKEN: ${{ inputs.github-token != '' && 'true' || 'false' }}
        VIGIL_VALUE_TASK_CLASS: ${{ inputs.value-task-class }}
        VIGIL_VALUE_BUDGET_USD: ${{ inputs.value-budget-usd }}
        VIGIL_VALUE_COST_USD: ${{ inputs.value-cost-usd }}
        VIGIL_VALUE_COST_SOURCE: ${{ inputs.value-cost-source }}
        VIGIL_VALUE_COST_EVIDENCE: ${{ inputs.value-cost-evidence }}
        VIGIL_VALUE_REVIEW_MINUTES: ${{ inputs.value-review-minutes }}
        VIGIL_REVERT_EVIDENCE: ${{ inputs.revert-commit-evidence }}
        VIGIL_HOTFIX_EVIDENCE: ${{ inputs.hotfix-pr-evidence }}
        VIGIL_INCIDENT_EVIDENCE: ${{ inputs.incident-issue-evidence }}
      run: |
        /usr/bin/env -i \
          LANG=C LC_ALL=C TZ=UTC PATH=/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin \
          "GITHUB_ACTION_PATH=${GITHUB_ACTION_PATH-}" \
          "GITHUB_EVENT_NAME=${GITHUB_EVENT_NAME-}" \
          "GITHUB_EVENT_PATH=${GITHUB_EVENT_PATH-}" \
          "GITHUB_WORKSPACE=${GITHUB_WORKSPACE-}" \
          "GITHUB_OUTPUT=${GITHUB_OUTPUT-}" \
          "GITHUB_STEP_SUMMARY=${GITHUB_STEP_SUMMARY-}" \
          "GITHUB_REPOSITORY=${GITHUB_REPOSITORY-}" \
          "GITHUB_ACTIONS=${GITHUB_ACTIONS-}" \
          "RUNNER_OS=${RUNNER_OS-}" \
          "RUNNER_ENVIRONMENT=${RUNNER_ENVIRONMENT-}" \
          "RUNNER_TEMP=${RUNNER_TEMP-}" \
          "VIGIL_TRANSCRIPT=${VIGIL_TRANSCRIPT-}" \
          "VIGIL_ATTEST=${VIGIL_ATTEST-}" \
          "VIGIL_RECEIPT=${VIGIL_RECEIPT-}" \
          "VIGIL_AUTHORITY_CONTRACT=${VIGIL_AUTHORITY_CONTRACT-}" \
          "VIGIL_AUTHORITY_CONTRACT_REF=${VIGIL_AUTHORITY_CONTRACT_REF-}" \
          "VIGIL_MODE=${VIGIL_MODE-}" \
          "VIGIL_CONTINUITY_CHAIN=${VIGIL_CONTINUITY_CHAIN-}" \
          "VIGIL_CONTINUITY_ENVIRONMENT=${VIGIL_CONTINUITY_ENVIRONMENT-}" \
          "VIGIL_OUTCOME_RECEIPT=${VIGIL_OUTCOME_RECEIPT-}" \
          "VIGIL_ACTIONS_RUN_ID=${VIGIL_ACTIONS_RUN_ID-}" \
          "VIGIL_REPO=${VIGIL_REPO-}" \
          "VIGIL_BASE=${VIGIL_BASE-}" \
          "VIGIL_HEAD=${VIGIL_HEAD-}" \
          "VIGIL_TEST_CMD=${VIGIL_TEST_CMD-}" \
          "VIGIL_ISOLATE_CANDIDATE=${VIGIL_ISOLATE_CANDIDATE-}" \
          "VIGIL_CANDIDATE_SETUP_COMMAND=${VIGIL_CANDIDATE_SETUP_COMMAND-}" \
          "VIGIL_CANDIDATE_IMAGE_INPUT=${VIGIL_CANDIDATE_IMAGE_INPUT-}" \
          "VIGIL_POLICY=${VIGIL_POLICY-}" \
          "VIGIL_POLICY_REF=${VIGIL_POLICY_REF-}" \
          "VIGIL_STRICT=${VIGIL_STRICT-}" \
          "VIGIL_MIN_VERIFIED=${VIGIL_MIN_VERIFIED-}" \
          "VIGIL_GITHUB_TOKEN=${VIGIL_GITHUB_TOKEN-}" \
          "VIGIL_HAS_GITHUB_TOKEN=${VIGIL_HAS_GITHUB_TOKEN-}" \
          "VIGIL_VALUE_TASK_CLASS=${VIGIL_VALUE_TASK_CLASS-}" \
          "VIGIL_VALUE_BUDGET_USD=${VIGIL_VALUE_BUDGET_USD-}" \
          "VIGIL_VALUE_COST_USD=${VIGIL_VALUE_COST_USD-}" \
          "VIGIL_VALUE_COST_SOURCE=${VIGIL_VALUE_COST_SOURCE-}" \
          "VIGIL_VALUE_COST_EVIDENCE=${VIGIL_VALUE_COST_EVIDENCE-}" \
          "VIGIL_VALUE_REVIEW_MINUTES=${VIGIL_VALUE_REVIEW_MINUTES-}" \
          "VIGIL_REVERT_EVIDENCE=${VIGIL_REVERT_EVIDENCE-}" \
          "VIGIL_HOTFIX_EVIDENCE=${VIGIL_HOTFIX_EVIDENCE-}" \
          "VIGIL_INCIDENT_EVIDENCE=${VIGIL_INCIDENT_EVIDENCE-}" \
          /bin/bash --noprofile --norc -e -o pipefail -s <<'AGENT_VIGIL_TRUSTED_BOOTSTRAP'
        set -eo pipefail
        set +x
        umask 077
        export BASH_ENV='' ENV='' PS4='' BASH_XTRACEFD='' CDPATH='' GLOBIGNORE=''
        unset POSIXLY_CORRECT
        export LD_PRELOAD='' LD_LIBRARY_PATH='' LD_AUDIT=''
        export DYLD_INSERT_LIBRARIES='' DYLD_LIBRARY_PATH='' DYLD_FRAMEWORK_PATH=''
        export OPENSSL_CONF='' OPENSSL_MODULES='' NODE_OPTIONS='' NODE_PATH=''
        readonly VIGIL_SAFE_PATH='/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin'
        readonly VIGIL_VERIFIER_PATH='/usr/bin:/bin'
        export PATH="$VIGIL_SAFE_PATH"
        unset GIT_DIR GIT_WORK_TREE GIT_INDEX_FILE GIT_OBJECT_DIRECTORY GIT_ALTERNATE_OBJECT_DIRECTORIES
        unset GIT_COMMON_DIR GIT_NAMESPACE GIT_CEILING_DIRECTORIES GIT_DISCOVERY_ACROSS_FILESYSTEM
        unset GIT_CONFIG GIT_CONFIG_GLOBAL GIT_CONFIG_SYSTEM GIT_CONFIG_COUNT GIT_ATTR_NOSYSTEM
        unset GIT_SSH GIT_SSH_COMMAND GIT_ASKPASS SSH_ASKPASS GIT_PROXY_COMMAND

        # Generic fixed host files remain ineligible when their bytes are
        # group- or world-writable. setup-node's hosted-toolcache Node binary is
        # the narrow exception: it must match an exact version, canonical path,
        # and reviewed official-release binary digest before any Node execution.
        readonly VIGIL_HOSTED_NODE_ROOT='/opt/hostedtoolcache/node'
        readonly VIGIL_MACOS_HOSTED_NODE_ROOT='/Users/runner/hostedtoolcache/node'
        readonly VIGIL_PINNED_NODE_VERSION='22.23.2'
        readonly VIGIL_PINNED_LINUX_X64_NODE_SHA256='3517c2df0b2f8cd7f422b4b8450ef81c6889f08eb03e281d6de9079b15e6a327'
        readonly VIGIL_PINNED_MACOS_X64_NODE_SHA256='0b4f059915f3bf3c6cbb02422f4a529bfb21cbbec2d29851c9a5d833f78a04f6'
        readonly VIGIL_PINNED_MACOS_ARM64_NODE_SHA256='18e387c90ab8a8400183e8bdd396376e1e875b91b4c874b894dcade7b35bf572'

        bootstrap_host_file() {
          local selected="$1" parent canonical_parent
          parent="${selected%/*}"
          canonical_parent=$(cd "$parent" 2>/dev/null && pwd -P) || return 1
          selected="$canonical_parent/${selected##*/}"
          [[ "$selected" == "$1" && -f "$selected" && ! -L "$selected" && -x "$selected" && ! -w "$selected" ]] || return 1
          printf '%s' "$selected"
        }

        VIGIL_STAT_BIN=$(bootstrap_host_file /usr/bin/stat) || {
          echo "agent-vigil: trusted host stat is unavailable" >&2
          exit 2
        }
        file_mode() {
          local selected="$1" mode
          mode=$("$VIGIL_STAT_BIN" -c '%a' -- "$selected" 2>/dev/null) || \
            mode=$("$VIGIL_STAT_BIN" -f '%Lp' "$selected" 2>/dev/null) || return 1
          [[ "$mode" =~ ^[0-7]{3,4}$ ]] || return 1
          printf '%s' "$mode"
        }
        file_fingerprint() {
          local selected="$1" value
          value=$("$VIGIL_STAT_BIN" -c '%d:%i:%s:%Y:%a' -- "$selected" 2>/dev/null) || \
            value=$("$VIGIL_STAT_BIN" -f '%d:%i:%z:%m:%Lp' "$selected" 2>/dev/null) || return 1
          [[ "$value" =~ ^[0-9]+:[0-9]+:[0-9]+:[0-9]+:[0-7]{3,4}$ ]] || return 1
          printf '%s' "$value"
        }
        path_is_inside() {
          local selected="$1" root="$2"
          [[ -n "$root" && ( "$selected" == "$root" || "$selected" == "$root"/* ) ]]
        }
        canonical_host_file() {
          local selected="$1" parent canonical_parent mode
          parent="${selected%/*}"
          canonical_parent=$(cd "$parent" 2>/dev/null && pwd -P) || return 1
          selected="$canonical_parent/${selected##*/}"
          [[ "$selected" == "$1" && -f "$selected" && ! -L "$selected" && -x "$selected" ]] || return 1
          mode=$(file_mode "$selected") || return 1
          (( (8#$mode & 022) == 0 )) || return 1
          if path_is_inside "$selected" "${GITHUB_WORKSPACE:-}" \
            || path_is_inside "$selected" "${RUNNER_TEMP:-}" \
            || path_is_inside "$selected" "${GITHUB_ACTION_PATH:-}"; then return 1; fi
          printf '%s' "$selected"
        }
        valid_node_source() {
          case "$1" in
            "$VIGIL_HOSTED_NODE_ROOT/$VIGIL_PINNED_NODE_VERSION/x64/bin/node") return 0 ;;
            "$VIGIL_MACOS_HOSTED_NODE_ROOT/$VIGIL_PINNED_NODE_VERSION/x64/bin/node") return 0 ;;
            "$VIGIL_MACOS_HOSTED_NODE_ROOT/$VIGIL_PINNED_NODE_VERSION/arm64/bin/node") return 0 ;;
            *) return 1 ;;
          esac
        }

        VIGIL_ENV_BIN=$(canonical_host_file /usr/bin/env) || true
        VIGIL_GIT_BIN=$(canonical_host_file /usr/bin/git) || true
        VIGIL_DOCKER_BIN=''
        if [[ "$VIGIL_ISOLATE_CANDIDATE" == "true" ]]; then
          VIGIL_DOCKER_BIN=$(canonical_host_file /usr/bin/docker) || true
        fi
        VIGIL_MKTEMP_BIN=$(canonical_host_file /usr/bin/mktemp) || true
        VIGIL_CP_BIN=''
        for candidate in /usr/bin/cp /bin/cp; do
          if resolved=$(canonical_host_file "$candidate"); then VIGIL_CP_BIN="$resolved"; break; fi
        done
        VIGIL_CHMOD_BIN=''
        for candidate in /usr/bin/chmod /bin/chmod; do
          if resolved=$(canonical_host_file "$candidate"); then VIGIL_CHMOD_BIN="$resolved"; break; fi
        done
        VIGIL_CMP_BIN=$(canonical_host_file /usr/bin/cmp) || true
        VIGIL_RM_BIN=''
        for candidate in /usr/bin/rm /bin/rm; do
          if resolved=$(canonical_host_file "$candidate"); then VIGIL_RM_BIN="$resolved"; break; fi
        done
        VIGIL_SHA_BIN=''
        for candidate in /usr/bin/sha256sum /usr/bin/shasum; do
          if resolved=$(canonical_host_file "$candidate"); then VIGIL_SHA_BIN="$resolved"; break; fi
        done
        host_file_sha256() {
          local selected="$1" digest
          if [[ "$VIGIL_SHA_BIN" == */sha256sum ]]; then
            digest=$("$VIGIL_SHA_BIN" "$selected" | { read -r value _; printf '%s' "$value"; })
          else
            digest=$("$VIGIL_SHA_BIN" -a 256 "$selected" | { read -r value _; printf '%s' "$value"; })
          fi
          [[ "$digest" =~ ^[0-9a-f]{64}$ ]] || return 1
          printf '%s' "$digest"
        }
        expected_hosted_node_sha256() {
          case "$1" in
            "$VIGIL_HOSTED_NODE_ROOT/$VIGIL_PINNED_NODE_VERSION/x64/bin/node")
              printf '%s' "$VIGIL_PINNED_LINUX_X64_NODE_SHA256" ;;
            "$VIGIL_MACOS_HOSTED_NODE_ROOT/$VIGIL_PINNED_NODE_VERSION/x64/bin/node")
              printf '%s' "$VIGIL_PINNED_MACOS_X64_NODE_SHA256" ;;
            "$VIGIL_MACOS_HOSTED_NODE_ROOT/$VIGIL_PINNED_NODE_VERSION/arm64/bin/node")
              printf '%s' "$VIGIL_PINNED_MACOS_ARM64_NODE_SHA256" ;;
            *) return 1 ;;
          esac
        }
        canonical_pinned_hosted_node_file() {
          local requested="$1" selected parent canonical_parent before after expected_sha observed_sha
          parent="${requested%/*}"
          canonical_parent=$(cd "$parent" 2>/dev/null && pwd -P) || return 1
          selected="$canonical_parent/${requested##*/}"
          [[ "$selected" == "$requested" && -f "$selected" && ! -L "$selected" && -x "$selected" ]] || return 1
          valid_node_source "$selected" || return 1
          if path_is_inside "$selected" "${GITHUB_WORKSPACE:-}" \
            || path_is_inside "$selected" "${RUNNER_TEMP:-}" \
            || path_is_inside "$selected" "${GITHUB_ACTION_PATH:-}"; then return 1; fi
          before=$(file_fingerprint "$selected") || return 1
          expected_sha=$(expected_hosted_node_sha256 "$selected") || return 1
          observed_sha=$(host_file_sha256 "$selected") || return 1
          after=$(file_fingerprint "$selected") || return 1
          [[ "$before" == "$after" && "$observed_sha" == "$expected_sha" ]] || return 1
          printf '%s' "$selected"
        }
        VIGIL_NODE_SOURCE=''
        for candidate in \
          "$VIGIL_HOSTED_NODE_ROOT/$VIGIL_PINNED_NODE_VERSION/x64/bin/node" \
          "$VIGIL_MACOS_HOSTED_NODE_ROOT/$VIGIL_PINNED_NODE_VERSION/x64/bin/node" \
          "$VIGIL_MACOS_HOSTED_NODE_ROOT/$VIGIL_PINNED_NODE_VERSION/arm64/bin/node"; do
          if resolved=$(canonical_pinned_hosted_node_file "$candidate"); then
            VIGIL_NODE_SOURCE="$resolved"
            break
          fi
        done
        if [[ -z "$VIGIL_ENV_BIN" || -z "$VIGIL_GIT_BIN" || -z "$VIGIL_MKTEMP_BIN" \
          || -z "$VIGIL_CP_BIN" || -z "$VIGIL_CHMOD_BIN" || -z "$VIGIL_CMP_BIN" \
          || -z "$VIGIL_RM_BIN" || -z "$VIGIL_SHA_BIN" || -z "$VIGIL_NODE_SOURCE" \
          || ( "$VIGIL_ISOLATE_CANDIDATE" == "true" && -z "$VIGIL_DOCKER_BIN" ) ]]; then
          missing_runtime=''
          [[ -n "$VIGIL_ENV_BIN" ]] || missing_runtime+=' env'
          [[ -n "$VIGIL_GIT_BIN" ]] || missing_runtime+=' git'
          [[ -n "$VIGIL_MKTEMP_BIN" ]] || missing_runtime+=' mktemp'
          [[ -n "$VIGIL_CP_BIN" ]] || missing_runtime+=' cp'
          [[ -n "$VIGIL_CHMOD_BIN" ]] || missing_runtime+=' chmod'
          [[ -n "$VIGIL_CMP_BIN" ]] || missing_runtime+=' cmp'
          [[ -n "$VIGIL_RM_BIN" ]] || missing_runtime+=' rm'
          [[ -n "$VIGIL_SHA_BIN" ]] || missing_runtime+=' sha256'
          [[ -n "$VIGIL_NODE_SOURCE" ]] || missing_runtime+=' node'
          [[ "$VIGIL_ISOLATE_CANDIDATE" != "true" || -n "$VIGIL_DOCKER_BIN" ]] || missing_runtime+=' docker'
          echo "agent-vigil: trusted host runtime is unavailable:$missing_runtime" >&2
          exit 2
        fi
        readonly VIGIL_STAT_BIN VIGIL_ENV_BIN VIGIL_GIT_BIN VIGIL_MKTEMP_BIN VIGIL_CP_BIN
        readonly VIGIL_CHMOD_BIN VIGIL_CMP_BIN VIGIL_RM_BIN VIGIL_SHA_BIN VIGIL_NODE_SOURCE VIGIL_DOCKER_BIN

        if [[ -z "${RUNNER_TEMP:-}" || ! -d "$RUNNER_TEMP" || -L "$RUNNER_TEMP" ]]; then
          echo "agent-vigil: runner-owned temporary directory is unavailable" >&2
          exit 2
        fi
        runner_real=$(cd "$RUNNER_TEMP" 2>/dev/null && pwd -P) || exit 2
        [[ "$RUNNER_TEMP" == "$runner_real" ]] || exit 2
        VIGIL_RUNTIME_DIR=$("$VIGIL_MKTEMP_BIN" -d "$runner_real/agent-vigil-runtime.XXXXXX") || exit 2
        [[ "$VIGIL_RUNTIME_DIR" == "$runner_real"/agent-vigil-runtime.[A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9] \
          && -d "$VIGIL_RUNTIME_DIR" && ! -L "$VIGIL_RUNTIME_DIR" && -O "$VIGIL_RUNTIME_DIR" ]] || exit 2
        "$VIGIL_CHMOD_BIN" 700 "$VIGIL_RUNTIME_DIR"
        cleanup_runtime() {
          [[ -n "${VIGIL_RUNTIME_DIR:-}" && "$VIGIL_RUNTIME_DIR" == "$runner_real"/agent-vigil-runtime.[A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9][A-Za-z0-9] \
            && -d "$VIGIL_RUNTIME_DIR" && ! -L "$VIGIL_RUNTIME_DIR" && -O "$VIGIL_RUNTIME_DIR" ]] || return 1
          "$VIGIL_RM_BIN" -rf -- "$VIGIL_RUNTIME_DIR"
          [[ ! -e "$VIGIL_RUNTIME_DIR" && ! -L "$VIGIL_RUNTIME_DIR" ]]
        }
        trap 'cleanup_runtime >/dev/null 2>&1 || true' EXIT
        VIGIL_NODE_BIN="$VIGIL_RUNTIME_DIR/node"
        node_source_before=$(file_fingerprint "$VIGIL_NODE_SOURCE") || exit 2
        node_source_sha=$(host_file_sha256 "$VIGIL_NODE_SOURCE") || exit 2
        expected_node_source_sha=$(expected_hosted_node_sha256 "$VIGIL_NODE_SOURCE") || exit 2
        [[ "$node_source_sha" == "$expected_node_source_sha" ]] || exit 2
        "$VIGIL_CP_BIN" "$VIGIL_NODE_SOURCE" "$VIGIL_NODE_BIN"
        "$VIGIL_CHMOD_BIN" 500 "$VIGIL_NODE_BIN"
        VIGIL_TEST_HOME="$VIGIL_RUNTIME_DIR/home"
        node_source_after=$(file_fingerprint "$VIGIL_NODE_SOURCE") || exit 2
        [[ "$node_source_before" == "$node_source_after" ]] || exit 2
