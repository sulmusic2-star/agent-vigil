        process.stdout.write(value);
        NODE
          ) || return 1
          metadata=$(
            "$VIGIL_ENV_BIN" -i LANG=C LC_ALL=C TZ=UTC PATH=/usr/bin:/bin HOME="$VIGIL_TEST_HOME" \
              GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_SYSTEM=/dev/null GIT_CONFIG_GLOBAL=/dev/null \
              GIT_NO_REPLACE_OBJECTS=1 GIT_OPTIONAL_LOCKS=0 GIT_TERMINAL_PROMPT=0 \
              GIT_LITERAL_PATHSPECS=1 GIT_ASKPASS=/bin/false SSH_ASKPASS=/bin/false GIT_SSH_COMMAND=/bin/false \
              "$VIGIL_GIT_BIN" --no-pager --no-replace-objects \
                -c core.hooksPath=/dev/null -c core.fsmonitor=false -c core.attributesFile=/dev/null \
                -c credential.helper= -c diff.external= -c protocol.ext.allow=never \
                -C "$VIGIL_REPO" ls-tree -z "$VIGIL_HEAD" -- "$normalized" 2>>"$verifier_log" \
            | "$VIGIL_ENV_BIN" -i LANG=C LC_ALL=C TZ=UTC \
                "$VIGIL_NODE_BIN" -e '
                  const expected=Buffer.from(process.argv[1],"utf8"), chunks=[];
                  process.stdin.on("data",(chunk)=>chunks.push(chunk));
                  process.stdin.on("end",()=>{
                    const value=Buffer.concat(chunks), zero=value.indexOf(0);
                    if(zero<0||zero!==value.length-1||value.indexOf(0,zero+1)!==-1)process.exit(2);
                    const row=value.subarray(0,zero), tab=row.indexOf(9);
                    if(tab<0||!row.subarray(tab+1).equals(expected))process.exit(2);
                    const fields=row.subarray(0,tab).toString("ascii").split(" ");
                    if(fields.length!==3)process.exit(2);
                    process.stdout.write(fields.join("\t"));
                  });
